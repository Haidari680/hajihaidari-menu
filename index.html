<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مجموعه حاجی حیدری</title>

<style>
body{
margin:0;
font-family:tahoma;
background:#f5f5f5;
}
header{
background:#6A1B9A;
color:white;
padding:25px;
text-align:center;
}
.card{
background:white;
margin:15px;
padding:15px;
border-radius:15px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}
img{
width:100%;
border-radius:10px;
}
.price{
color:#6A1B9A;
font-size:22px;
font-weight:bold;
}
button{
background:#6A1B9A;
color:white;
border:none;
padding:10px 20px;
border-radius:10px;
font-size:18px;
}
</style>

</head>

<body>

<header>

<h1>مجموعه حاجی حیدری</h1>

<p>منوی دیجیتالی</p>

</header>

<div class="card">

<h2>کباب کوبیده</h2>

<img src="https://images.unsplash.com/photo-1544025162-d76694265947?w=800">

<p>کباب کوبیده تازه همراه برنج</p>

<div class="price">۳۵۰ افغانی</div>

<br>

<button>سفارش</button>

</div>

<div class="card">

<h2>جوجه کباب</h2>

<img src="https://images.unsplash.com/photo-1600891964092-4316c288032e?w=800">

<p>جوجه کباب مخصوص</p>

<div class="price">۳۰۰ افغانی</div>

<br>

<button>سفارش</button>

</div>

</body>
</html>
