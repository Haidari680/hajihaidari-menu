<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مجموعه حاجی حیدری</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f4f8fc;
    color:#17324d;
}

button,input,textarea,select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

header{
    background:#0879d1;
    color:white;
    padding:12px 18px;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 3px 12px #0002;
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand-logo{
    width:58px;
    height:58px;
    border-radius:50%;
    object-fit:cover;
    background:white;
    border:3px solid white;
}

.brand h1{
    margin:0;
    font-size:22px;
}

.brand p{
    margin:5px 0 0;
    font-size:12px;
    opacity:.9;
}

.admin-open{
    background:white;
    color:#0879d1;
    border:0;
    border-radius:10px;
    padding:10px 15px;
    font-weight:bold;
}

/* HERO */

.hero{
    max-width:1200px;
    margin:15px auto;
    min-height:220px;
    border-radius:22px;
    overflow:hidden;
    position:relative;
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
}

.hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(90deg,#006bbdcc,#ffffff33);
}

.hero-content{
    position:relative;
    z-index:1;
    color:white;
}

.hero-content img{
    width:80px;
    height:80px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid white;
    background:white;
}

.hero h2{
    margin:12px 0 5px;
    font-size:30px;
}

.hero p{
    margin:0;
}

/* INFO */

.info{
    max-width:1200px;
    margin:0 auto 15px;
    background:white;
    border:1px solid #d8e8f5;
    border-radius:15px;
    padding:13px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.map-btn{
    background:#0879d1;
    color:white;
    border:0;
    border-radius:9px;
    padding:9px 14px;
}

/* CATEGORIES */

.categories{
    max-width:1200px;
    margin:auto;
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:5px 10px 15px;
}

.category-btn{
    white-space:nowrap;
    border:1px solid #b9d9ef;
    background:white;
    color:#0879d1;
    padding:11px 20px;
    border-radius:25px;
    font-weight:bold;
}

.category-btn.active{
    background:#0879d1;
    color:white;
}

/* MENU */

.menu{
    max-width:1200px;
    margin:auto;
    padding:0 10px 100px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    border:1px solid #d9e8f3;
    box-shadow:0 3px 12px #0879d110;
}

.card img{
    width:100%;
    height:190px;
    object-fit:cover;
}

.card-body{
    padding:15px;
}

.card h3{
    margin:0 0 7px;
    color:#075d9e;
}

.description{
    font-size:13px;
    color:#63788a;
    min-height:38px;
}

.card-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-top:12px;
}

.price{
    color:#0879d1;
    font-size:18px;
    font-weight:bold;
}

.add-btn{
    border:0;
    background:#0879d1;
    color:white;
    border-radius:9px;
    padding:9px 15px;
}

.empty{
    text-align:center;
    padding:50px;
    color:#789;
}

/* CART */

.cart{
    position:fixed;
    left:20px;
    bottom:20px;
    z-index:1500;
}

.cart-button{
    border:0;
    background:#0879d1;
    color:white;
    border-radius:30px;
    padding:13px 20px;
    box-shadow:0 5px 20px #0003;
    font-weight:bold;
}

.cart-panel{
    display:none;
    position:absolute;
    bottom:60px;
    left:0;
    width:340px;
    max-height:500px;
    overflow:auto;
    background:white;
    border-radius:18px;
    box-shadow:0 8px 30px #0004;
    padding:18px;
}

.cart-panel.show{
    display:block;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    gap:8px;
    padding:10px 0;
    border-bottom:1px solid #eee;
}

.qty{
    display:flex;
    align-items:center;
    gap:7px;
}

.qty button{
    border:0;
    width:28px;
    height:28px;
    border-radius:50%;
    background:#e8f4fc;
    color:#0879d1;
}

.checkout{
    width:100%;
    border:0;
    background:#0879d1;
    color:white;
    padding:12px;
    border-radius:10px;
    margin-top:12px;
}

/* WAITER */

.waiter{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:1500;
}

.waiter button{
    border:0;
    background:white;
    color:#0879d1;
    border:2px solid #0879d1;
    border-radius:30px;
    padding:12px 17px;
    font-weight:bold;
    box-shadow:0 4px 15px #0002;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#0008;
    z-index:3000;
    overflow:auto;
    padding:20px;
}

.modal.show{
    display:block;
}

.modal-box{
    max-width:900px;
    margin:20px auto;
    background:white;
    border-radius:20px;
    padding:20px;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #ddd;
    padding-bottom:12px;
}

.close{
    border:0;
    background:#eee;
    border-radius:8px;
    padding:8px 12px;
}

/* ADMIN */

.admin-section{
    background:#f5f9fd;
    border:1px solid #dbeaf5;
    padding:15px;
    border-radius:15px;
    margin:15px 0;
}

.admin-section h3{
    color:#0879d1;
    margin-top:0;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

input,textarea,select{
    width:100%;
    border:1px solid #cbdce8;
    border-radius:9px;
    padding:10px;
    background:white;
}

textarea{
    min-height:80px;
}

.admin-btn{
    border:0;
    background:#0879d1;
    color:white;
    padding:10px 15px;
    border-radius:9px;
    margin-top:8px;
}

.danger{
    background:#d93025;
}

.item-admin{
    background:white;
    border:1px solid #ddd;
    border-radius:12px;
    padding:12px;
    margin:8px 0;
}

.admin-actions{
    display:flex;
    gap:7px;
    margin-top:8px;
}

.preview{
    max-width:100%;
    max-height:150px;
    margin-top:8px;
    border-radius:10px;
}

/* MOBILE */

@media(max-width:800px){
    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .header-inner{
        flex-wrap:wrap;
    }

    .hero{
        margin:10px;
    }

    .info{
        margin:10px;
    }
}

@media(max-width:550px){
    .grid{
        grid-template-columns:1fr;
    }

    .brand h1{
        font-size:18px;
    }

    .brand p{
        font-size:10px;
    }

    .hero h2{
        font-size:24px;
    }

    .cart-panel{
        width:calc(100vw - 40px);
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .waiter{
        right:10px;
        bottom:75px;
    }

    .cart{
        left:10px;
        bottom:15px;
    }
}
</style>
</head>

<body>

<header>
<div class="header-inner">

<div class="brand">
<img id="logo" class="brand-logo" src="">
<div>
<h1 id="restaurantName">مجموعه حاجی حیدری</h1>
<p>منوی دیجیتالی رستورانت، کباب، پیتزا، غذا و آبمیوه</p>
</div>
</div>

<button class="admin-open" onclick="openAdmin()">
⚙ مدیریت منو
</button>

</div>
</header>


<section class="hero" id="hero">

<div class="hero-content">
<img id="heroLogo" src="">
<h2 id="heroTitle">مجموعه حاجی حیدری</h2>
<p id="heroText">به منوی دیجیتالی ما خوش آمدید</p>
</div>

</section>


<div class="info">

<div>
<strong>📍 آدرس:</strong>
<span id="address">آدرس رستورانت</span>
</div>

<button class="map-btn" onclick="openMap()">
🗺 مشاهده روی نقشه
</button>

</div>


<div class="categories" id="categories"></div>


<main class="menu">

<div class="grid" id="menuGrid"></div>

</main>


<!-- CART -->

<div class="cart">

<div class="cart-panel" id="cartPanel">

<h3>🛒 سفارش شما</h3>

<div id="cartItems"></div>

<hr>

<strong>
مجموع:
<span id="cartTotal">0</span> افغانی
</strong>

<button class="checkout" onclick="sendOrder()">
ثبت سفارش
</button>

</div>

<button class="cart-button" onclick="toggleCart()">
🛒 سبد سفارش
<span id="cartCount">0</span>
</button>

</div>


<!-- WAITER -->

<div class="waiter">

<button onclick="callWaiter()">
🔔 فراخوان گارسون
</button>

</div>


<!-- ADMIN MODAL -->

<div class="modal" id="adminModal">

<div class="modal-box">

<div class="modal-head">

<h2>⚙ مدیریت منو</h2>

<button class="close" onclick="closeAdmin()">✕</button>

</div>


<!-- GENERAL -->

<div class="admin-section">

<h3>تنظیمات عمومی</h3>

<div class="form-grid">

<div>
<label>نام مجموعه</label>
<input id="setName">
</div>

<div>
<label>متن زیر نام</label>
<input id="setSubtitle">
</div>

<div>
<label>آدرس</label>
<input id="setAddress">
</div>

<div>
<label>لینک نقشه</label>
<input id="setMap">
</div>

</div>

<button class="admin-btn" onclick="saveSettings()">
ذخیره تنظیمات
</button>

</div>


<!-- LOGO -->

<div class="admin-section">

<h3>لوگو و تصاویر</h3>

<label>لوگو</label>
<input type="file" accept="image/*" onchange="changeImage(event,'logo')">

<label>عکس پس‌زمینه</label>
<input type="file" accept="image/*" onchange="changeImage(event,'background')">

<label>عکس کوچک کنار لوگو</label>
<input type="file" accept="image/*" onchange="changeImage(event,'smallLogo')">

</div>


<!-- CATEGORY -->

<div class="admin-section">

<h3>دسته‌بندی‌ها</h3>

<div class="form-grid">

<input id="newCategory" placeholder="مثلاً کباب">

<button class="admin-btn" onclick="addCategory()">
+ اضافه کردن دسته
</button>

</div>

<div id="categoryAdmin"></div>

</div>


<!-- PRODUCT -->

<div class="admin-section">

<h3>اضافه کردن غذای جدید</h3>

<div class="form-grid">

<input id="itemName" placeholder="نام غذا">

<input id="itemPrice" type="number" placeholder="قیمت به افغانی">

<select id="itemCategory"></select>

</div>

<textarea id="itemDescription"
placeholder="توضیحات غذا"></textarea>

<label>عکس غذا</label>
<input type="file" id="itemImage" accept="image/*">

<br>

<button class="admin-btn" onclick="addItem()">
+ اضافه کردن غذا
</button>

</div>


<!-- ITEMS -->

<div class="admin-section">

<h3>مدیریت غذاها</h3>

<div id="itemsAdmin"></div>

</div>

</div>
</div>


<script>

/* =========================
   DEFAULT DATA
========================= */

const defaultData = {

settings:{
    name:"مجموعه حاجی حیدری",
    subtitle:"منوی دیجیتالی رستورانت، کباب، پیتزا، غذا و آبمیوه",
    address:"آدرس رستورانت را اینجا وارد کنید",
    map:"",
    logo:"https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=300",
    background:"https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?w=1400",
    smallLogo:"https://images.unsplash.com/photo-1547592180-85f173990554?w=300"
},

categories:[
    {id:"kabob",name:"کباب"},
    {id:"pizza",name:"پیتزا"},
    {id:"food",name:"غذا"},
    {id:"juice",name:"آبمیوه"}
],

items:[

{
id:1,
category:"kabob",
name:"کباب مخصوص حاجی حیدری",
price:320,
description:"کباب تازه و خوش‌طعم با مخلفات",
image:"https://images.unsplash.com/photo-1544025162-d76694265947?w=700"
},

{
id:2,
category:"kabob",
name:"کباب چوبی",
price:280,
description:"کباب چوبی با کیفیت و تازه",
image:"https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=700"
},

{
id:3,
category:"pizza",
name:"پیتزا مخصوص",
price:350,
description:"پیتزای تازه با پنیر و مواد مخصوص",
image:"https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=700"
},

{
id:4,
category:"food",
name:"غذای مخصوص",
price:300,
description:"غذای تازه و خوشمزه",
image:"https://images.unsplash.com/photo-1547592180-85f173990554?w=700"
},

{
id:5,
category:"juice",
name:"آبمیوه طبیعی",
price:120,
description:"آبمیوه تازه و طبیعی",
image:"https://images.unsplash.com/photo-1613478223719-2ab802602423?w=700"
}

]

};


/* =========================
   LOAD DATA
========================= */

let data;

try{

data=JSON.parse(localStorage.getItem("hajiHaideriMenu"));

if(!data){
    data=defaultData;
}

}catch(e){

data=defaultData;

}


let cart=[];

let activeCategory=
data.categories.length ?
data.categories[0].id :
null;


/* =========================
   SAVE
========================= */

function saveData(){

localStorage.setItem(
"hajiHaideriMenu",
JSON.stringify(data)
);

}


/* =========================
   RENDER HEADER
========================= */

function renderHeader(){

document.getElementById("restaurantName").textContent=
data.settings.name;

document.querySelector(".brand p").textContent=
data.settings.subtitle;

document.getElementById("heroTitle").textContent=
data.settings.name;

document.getElementById("heroText").textContent=
"به منوی دیجیتالی ما خوش آمدید";

document.getElementById("address").textContent=
data.settings.address;

document.getElementById("logo").src=
data.settings.logo;

document.getElementById("heroLogo").src=
data.settings.smallLogo;

document.getElementById("hero").style.backgroundImage=
`url("${data.settings.background}")`;

}


/* =========================
   CATEGORIES
========================= */

function renderCategories(){

const box=
document.getElementById("categories");

box.innerHTML="";

data.categories.forEach(cat=>{

const btn=document.createElement("button");

btn.className=
"category-btn "+
(cat.id===activeCategory ? "active":"");

btn.textContent=cat.name;

btn.onclick=()=>{

activeCategory=cat.id;

renderCategories();
renderMenu();

};

box.appendChild(btn);

});

}


/* =========================
   MENU
========================= */

function renderMenu(){

const grid=
document.getElementById("menuGrid");

grid.innerHTML="";

const items=
data.items.filter(
item=>item.category===activeCategory
);

if(!items.length){

grid.innerHTML=
`<div class="empty">
در این دسته هنوز غذایی اضافه نشده است.
</div>`;

return;

}

items.forEach(item=>{

const card=document.createElement("div");

card.className="card";

card.innerHTML=`

<img src="${item.image}">

<div class="card-body">

<h3>${item.name}</h3>

<div class="description">
${item.description || ""}
</div>

<div class="card-bottom">

<div class="price">
${Number(item.price).toLocaleString("fa-AF")} افغانی
</div>

<button class="add-btn"
onclick="addToCart(${item.id})">
افزودن
</button>

</div>

</div>
`;

grid.appendChild(card);

});

}


/* =========================
   CART
========================= */

function addToCart(id){

const item=data.items.find(x=>x.id===id);

if(!item)return;

const existing=
cart.find(x=>x.id===id);

if(existing){

existing.qty++;

}else{

cart.push({
id:id,
qty:1
});

}

renderCart();

}

function renderCart(){

const box=
document.getElementById("cartItems");

box.innerHTML="";

let total=0;
let count=0;

cart.forEach(c=>{

const item=
data.items.find(x=>x.id===c.id);

if(!item)return;

const subtotal=
item.price*c.qty;

total+=subtotal;
count+=c.qty;

const div=
document.createElement("div");

div.className="cart-item";

div.innerHTML=`

<div>
<strong>${item.name}</strong>
<br>
<small>
${subtotal.toLocaleString("fa-AF")} افغانی
</small>
</div>

<div class="qty">

<button onclick="changeQty(${item.id},-1)">
−
</button>

<span>${c.qty}</span>

<button onclick="changeQty(${item.id},1)">
+
</button>

</div>
`;

box.appendChild(div);

});

document.getElementById("cartTotal").textContent=
total.toLocaleString("fa-AF");

document.getElementById("cartCount").textContent=
count;

}


function changeQty(id,value){

const item=
cart.find(x=>x.id===id);

if(!item)return;

item.qty+=value;

if(item.qty<=0){

cart=
cart.filter(x=>x.id!==id);

}

renderCart();

}


function toggleCart(){

document
.getElementById("cartPanel")
.classList.toggle("show");

}


function sendOrder(){

if(!cart.length){

alert("سبد سفارش خالی است.");

return;

}

let text=
"سلام، سفارش من از مجموعه حاجی حیدری:%0A%0A";

let total=0;

cart.forEach(c=>{

const item=
data.items.find(x=>x.id===c.id);

if(item){

text+=
`${item.name} × ${c.qty} = ${item.price*c.qty} افغانی%0A`;

total+=item.price*c.qty;

}

});

text+=
`%0Aمجموع: ${total} افغانی`;

const phone=
"93700000000";

window.open(
`https://wa.me/${phone}?text=${text}`,
"_blank"
);

}


/* =========================
   WAITER
========================= */

function callWaiter(){

alert(
"🔔 درخواست شما ثبت شد.\nلطفاً منتظر آمدن گارسون باشید."
);

}


/* =========================
   MAP
========================= */

function openMap(){

if(data.settings.map){

window.open(
data.settings.map,
"_blank"
);

}else{

alert("لینک نقشه هنوز توسط مدیریت وارد نشده است.");

}

}


/* =========================
   ADMIN
========================= */

function openAdmin(){

document.getElementById("adminModal")
.classList.add("show");

loadAdmin();

}

function closeAdmin(){

document.getElementById("adminModal")
.classList.remove("show");

}


/* =========================
   LOAD ADMIN
========================= */

function loadAdmin(){

document.getElementById("setName").value=
data.settings.name;

document.getElementById("setSubtitle").value=
data.settings.subtitle;

document.getElementById("setAddress").value=
data.settings.address;

document.getElementById("setMap").value=
data.settings.map;

renderCategoryAdmin();

renderCategorySelect();

renderItemsAdmin();

}


/* =========================
   SAVE SETTINGS
========================= */

function saveSettings(){

data.settings.name=
document.getElementById("setName").value;

data.settings.subtitle=
document.getElementById("setSubtitle").value;

data.settings.address=
document.getElementById("setAddress").value;

data.settings.map=
document.getElementById("setMap").value;

saveData();

renderHeader();

alert("تنظیمات ذخیره شد.");

}


/* =========================
   IMAGE UPLOAD
========================= */

function changeImage(event,type){

const file=
event.target.files[0];

if(!file)return;

const reader=
new FileReader();

reader.onload=function(){

if(type==="logo"){

data.settings.logo=
reader.result;

}

if(type==="background"){

data.settings.background=
reader.result;

}

if(type==="smallLogo"){

data.settings.smallLogo=
reader.result;

}

saveData();

renderHeader();

alert("تصویر با موفقیت تغییر کرد.");

};

reader.readAsDataURL(file);

}


/* =========================
   CATEGORY ADMIN
========================= */

function addCategory(){

const input=
document.getElementById("newCategory");

const name=
input.value.trim();

if(!name){

alert("نام دسته را وارد کنید.");

return;

}

data.categories.push({

id:"cat_"+Date.now(),

name:name

});

input.value="";

saveData();

activeCategory=
data.categories[data.categories.length-1].id;

renderCategories();

renderCategoryAdmin();

renderCategorySelect();

renderMenu();

}


function renderCategoryAdmin(){

const box=
document.getElementById("categoryAdmin");

box.innerHTML="";

data.categories.forEach(cat=>{

const div=
document.createElement("div");

div.className="item-admin";

div.innerHTML=`

<strong>${cat.name}</strong>

<div class="admin-actions">

<button class="admin-btn"
onclick="renameCategory('${cat.id}')">
ویرایش نام
</button>

<button class="admin-btn danger"
onclick="deleteCategory('${cat.id}')">
حذف
</button>

</div>
`;

box.appendChild(div);

});

}


function renameCategory(id){

const cat=
data.categories.find(x=>x.id===id);

if(!cat)return;

const name=
prompt("نام جدید دسته:",cat.name);

if(name && name.trim()){

cat.name=name.trim();

saveData();

renderCategories();

renderCategoryAdmin();

renderCategorySelect();

}

}


function deleteCategory(id){

const cat=
data.categories.find(x=>x.id===id);

if(!cat)return;

const used=
data.items.some(x=>x.category===id);

if(used){

alert(
"این دسته دارای غذا است. ابتدا غذاهای آن را حذف یا منتقل کنید."
);

return;

}

if(!confirm(
`دسته «${cat.name}» حذف شود؟`
))return;

data.categories=
data.categories.filter(x=>x.id!==id);

activeCategory=
data.categories.length ?
data.categories[0].id :
null;

saveData();

renderCategories();

renderCategoryAdmin();

renderCategorySelect();

renderMenu();

}


/* =========================
   CATEGORY SELECT
========================= */

function renderCategorySelect(){

const select=
document.getElementById("itemCategory");

select.innerHTML="";

data.categories.forEach(cat=>{

const option=
document.createElement("option");

option.value=cat.id;

option.textContent=cat.name;

select.appendChild(option);

});

}


/* =========================
   ADD ITEM
========================= */

function addItem(){

const name=
document.getElementById("itemName").value.trim();

const price=
Number(
document.getElementById("itemPrice").value
);

const category=
document.getElementById("itemCategory").value;

const description=
document.getElementById("itemDescription").value.trim();

const file=
document.getElementById("itemImage").files[0];

if(!name){

alert("نام غذا را وارد کنید.");

return;

}

if(!price){

alert("قیمت را وارد کنید.");

return;

}

if(!category){

alert("دسته را انتخاب کنید.");

return;

}

function finish(image){

data.items.push({

id:Date.now(),

category:category,

name:name,

price:price,

description:description,

image:image || data.settings.smallLogo

});

saveData();

document.getElementById("itemName").value="";
document.getElementById("itemPrice").value="";
document.getElementById("itemDescription").value="";
document.getElementById("itemImage").value="";

renderMenu();

renderItemsAdmin();

alert("غذا اضافه شد.");

}

if(file){

const reader=
new FileReader();

reader.onload=()=>finish(reader.result);

reader.readAsDataURL(file);

}else{

finish("");

}

}


/* =========================
   ITEMS ADMIN
========================= */

function renderItemsAdmin(){

const box=
document.getElementById("itemsAdmin");

box.innerHTML="";

data.items.forEach(item=>{

const cat=
data.categories.find(
x=>x.id===item.category
);

const div=
document.createElement("div");

div.className="item-admin";

div.innerHTML=`

<strong>${item.name}</strong>

<br>

<span>
دسته: ${cat ? cat.name : "نامشخص"}
</span>

<br>

<span>
قیمت: ${Number(item.price).toLocaleString("fa-AF")} افغانی
</span>

<div class="admin-actions">

<button class="admin-btn"
onclick="editItem(${item.id})">
ویرایش
</button>

<button class="admin-btn danger"
onclick="deleteItem(${item.id})">
حذف
</button>

</div>
`;

box.appendChild(div);

});

}


/* =========================
   EDIT ITEM
========================= */

function editItem(id){

const item=
data.items.find(x=>x.id===id);

if(!item)return;

const name=
prompt("نام غذا:",item.name);

if(name===null)return;

const price=
prompt("قیمت:",item.price);

if(price===null)return;

const description=
prompt("توضیحات:",item.description || "");

if(description===null)return;

item.name=name.trim();

item.price=Number(price);

item.description=description;

saveData();

renderMenu();

renderItemsAdmin();

}


/* =========================
   DELETE ITEM
========================= */

function deleteItem(id){

const item=
data.items.find(x=>x.id===id);

if(!item)return;

if(!confirm(
`غذای «${item.name}» حذف شود؟`
))return;

data.items=
data.items.filter(x=>x.id!==id);

saveData();

renderMenu();

renderItemsAdmin();

}


/* =========================
   START
========================= */

renderHeader();

renderCategories();

renderCategorySelect();

renderMenu();

renderCart();

</script>

</body>
</html>
