 <!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مجموعه حاجی حیدری</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f4f8ff;
    color:#222;
}

header{
    background:#0879d1;
    color:white;
    padding:18px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:28px;
}

nav{
    position:sticky;
    top:0;
    z-index:100;
    background:white;
    padding:10px 20px;
    display:flex;
    justify-content:flex-start;
    gap:10px;
    box-shadow:0 2px 8px #0002;
}

nav button{
    border:0;
    border-radius:20px;
    padding:10px 20px;
    background:#e8f3ff;
    color:#0879d1;
    cursor:pointer;
    font-weight:bold;
}

nav button.active,
nav button:hover{
    background:#0879d1;
    color:white;
}

.container{
    max-width:900px;
    margin:25px auto;
    padding:0 15px;
}

.card{
    background:white;
    border-radius:18px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 3px 15px #0001;
}

h2{
    color:#0879d1;
    margin-top:0;
}

input,textarea,select{
    width:100%;
    padding:12px;
    margin:7px 0;
    border:1px solid #ccd6e5;
    border-radius:10px;
    font-family:inherit;
}

textarea{
    min-height:90px;
    resize:vertical;
}

button{
    font-family:inherit;
}

.btn{
    border:0;
    background:#0879d1;
    color:white;
    padding:11px 18px;
    border-radius:10px;
    cursor:pointer;
    margin:5px;
}

.btn:hover{
    opacity:.9;
}

.btn-danger{
    background:#e53935;
}

.btn-secondary{
    background:#666;
}

.category-list{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:15px;
}

.category{
    background:#eef6ff;
    border:1px solid #bcdcff;
    padding:10px 14px;
    border-radius:12px;
    display:flex;
    align-items:center;
    gap:7px;
}

.food{
    display:grid;
    grid-template-columns:120px 1fr;
    gap:18px;
    padding:15px 0;
    border-bottom:1px solid #eee;
}

.food img{
    width:120px;
    height:100px;
    object-fit:cover;
    border-radius:12px;
}

.food h3{
    margin:0 0 8px;
}

.price{
    color:#0879d1;
    font-size:20px;
    font-weight:bold;
}

.small{
    color:#777;
    font-size:13px;
}

.admin{
    display:none;
}

.preview{
    display:block;
}

.message{
    padding:12px;
    background:#e8f7ed;
    color:#18733a;
    border-radius:10px;
    margin:10px 0;
    display:none;
}

footer{
    background:#0879d1;
    color:white;
    text-align:center;
    padding:30px;
    margin-top:30px;
}

@media(max-width:600px){
    nav{
        overflow-x:auto;
        justify-content:flex-start;
    }

    .food{
        grid-template-columns:90px 1fr;
    }

    .food img{
        width:90px;
        height:80px;
    }
}
</style>
</head>

<body>

<header>
    <h1 id="groupTitle">مجموعه حاجی حیدری</h1>
    <p>منوی آنلاین</p>
</header>

<!-- دکمه‌های بالا سمت راست -->
<nav>
    <button class="active" onclick="showSection('home',this)">کباب</button>
    <button onclick="showSection('food',this)">غذا</button>
    <button onclick="showSection('pizza',this)">پیتزا</button>
    <button onclick="showSection('drinks',this)">آبمیوه</button>
    <button onclick="showSection('admin',this)">مدیریت</button>
</nav>

<div class="container">

<section id="home" class="preview">
    <div class="card">
        <h2>🍽️ منوی ویژه</h2>
        <div id="homeFoods"></div>
    </div>
</section>

<section id="food" class="preview" style="display:none">
    <div class="card">
        <h2>🍛 غذا</h2>
        <div id="foodList"></div>
    </div>
</section>

<section id="pizza" class="preview" style="display:none">
    <div class="card">
        <h2>🍕 پیتزا</h2>
        <div id="pizzaList"></div>
    </div>
</section>

<section id="drinks" class="preview" style="display:none">
    <div class="card">
        <h2>🥤 آبمیوه</h2>
        <div id="drinkList"></div>
    </div>
</section>

<section id="admin" class="admin">
    <div class="card">
        <h2>⚙️ مدیریت منو</h2>

        <h3>اطلاعات مجموعه</h3>

        <input id="nameInput" placeholder="نام مجموعه">

        <label>تغییر لوگو:</label>
        <input type="file" id="logoInput" accept="image/*">

        <label>تغییر عکس پس‌زمینه:</label>
        <input type="file" id="bgInput" accept="image/*">

        <button class="btn" onclick="saveInfo()">ذخیره اطلاعات</button>

        <hr>

        <h3>➕ افزودن دسته‌بندی</h3>

        <input id="categoryInput"
               placeholder="مثلاً کباب، پیتزا، غذا، آبمیوه">

        <button class="btn" onclick="addCategory()">
            افزودن دسته
        </button>

        <div id="categories" class="category-list"></div>

        <hr>

        <h3>🍽️ افزودن غذا</h3>

        <input id="foodName" placeholder="نام غذا">

        <input id="foodPrice"
               type="number"
               placeholder="قیمت">

        <textarea id="foodDesc"
                  placeholder="توضیحات غذا"></textarea>

        <select id="foodCategory">
    <option value="">انتخاب دسته</option>
    <option value="غذا">غذا</option>
    <option value="سینی‌ها">سینی‌ها</option>
    <option value="کباب‌ها">کباب‌ها</option>
    <option value="پیتزا">پیتزا</option>
    <option value="آبمیوه">آبمیوه</option>
    <option value="نوشیدنی سرد">نوشیدنی سرد</option>
    <option value="مخصوص‌ها">مخصوص‌ها</option>
    <option value="ساده‌ها">ساده‌ها</option>
</select>

        <input type="file"
               id="foodImage"
               accept="image/*">

        <button class="btn" onclick="addFood()">
            افزودن غذا
        </button>

        <div id="message" class="message"></div>

        <hr>

        <h3>📍 آدرس و نقشه</h3>

        <input id="address"
               placeholder="آدرس مجموعه">

        <input id="mapLink"
               placeholder="لینک Google Maps">

        <button class="btn" onclick="saveAddress()">
            ذخیره آدرس
        </button>

        <hr>

        <h3>🗑️ مدیریت غذاها</h3>

        <div id="adminFoods"></div>

    </div>
</section>

</div>

<footer>
    <p>🔔 خوش آمدید</p>
    <p id="footerName">مجموعه حاجی حیدری</p>
</footer>

<script>

let data={
    name:"مجموعه حاجی حیدری",
    categories:["کباب","غذا","پیتزا","آبمیوه"],
    foods:[
        {
            name:"کباب ویژه",
            price:250,
            desc:"کباب تازه و خوشمزه",
            category:"کباب",
            image:""
        }
    ],
    address:"",
    mapLink:"",
    logo:"",
    background:""
};

function loadData(){

    let saved=localStorage.getItem("hajiMenu");

    if(saved){
        try{
            data=JSON.parse(saved);
        }catch(e){}
    }

    render();
}

function saveData(){
    localStorage.setItem("hajiMenu",JSON.stringify(data));
}

function render(){

    document.getElementById("groupTitle").innerText=data.name;
    document.getElementById("footerName").innerText=data.name;

    renderCategories();
    renderFoods();
    renderAdminFoods();

    if(data.background){
        document.body.style.backgroundImage=
            "url("+data.background+")";
        document.body.style.backgroundSize="cover";
        document.body.style.backgroundAttachment="fixed";
    }
}

function showSection(id,btn){

    document.querySelectorAll(".preview,.admin")
        .forEach(x=>x.style.display="none");

    document.getElementById(id).style.display="block";

    document.querySelectorAll("nav button")
        .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");
}

function renderCategories(){

    let box=document.getElementById("categories");
    box.innerHTML="";

    data.categories.forEach((cat,index)=>{

        let div=document.createElement("div");
        div.className="category";

        div.innerHTML=`
            <span>${cat}</span>

            <button class="btn"
                    onclick="moveCategory(${index},-1)">
                ◀
            </button>

            <button class="btn"
                    onclick="moveCategory(${index},1)">
                ▶
            </button>

            <button class="btn btn-danger"
                    onclick="deleteCategory(${index})">
                ×
            </button>
        `;

        box.appendChild(div);
    });
}

function addCategory(){

    let input=document.getElementById("categoryInput");
    let value=input.value.trim();

    if(!value)return;

    if(!data.categories.includes(value)){
        data.categories.push(value);
    }

    input.value="";
    saveData();
    render();
}

function deleteCategory(index){

    if(!confirm("این دسته حذف شود؟"))return;

    data.categories.splice(index,1);

    saveData();
    render();
}

function moveCategory(index,direction){

    let newIndex=index+direction;

    if(newIndex<0 || newIndex>=data.categories.length)
        return;

    let temp=data.categories[index];

    data.categories[index]=data.categories[newIndex];
    data.categories[newIndex]=temp;

    saveData();
    render();
}

function addFood(){

    let name=document.getElementById("foodName").value.trim();
    let price=document.getElementById("foodPrice").value;
    let desc=document.getElementById("foodDesc").value.trim();
    let category=document.getElementById("foodCategory").value;
    let input=document.getElementById("foodImage");

    if(!name){
        alert("نام غذا را وارد کنید");
        return;
    }

    if(input.files[0]){

        let reader=new FileReader();

        reader.onload=function(e){

            data.foods.push({
                name:name,
                price:price,
                desc:desc,
                category:category,
                image:e.target.result
            });

            finishFood();
        };

        reader.readAsDataURL(input.files[0]);

    }else{

        data.foods.push({
            name:name,
            price:price,
            desc:desc,
            category:category,
            image:""
        });

        finishFood();
    }
}

function finishFood(){

    document.getElementById("foodName").value="";
    document.getElementById("foodPrice").value="";
    document.getElementById("foodDesc").value="";
    document.getElementById("foodImage").value="";

    saveData();
    render();

    let msg=document.getElementById("message");
    msg.innerText="غذا با موفقیت اضافه شد";
    msg.style.display="block";

    setTimeout(()=>{
        msg.style.display="none";
    },2500);
}

function renderFoods(){

    let boxes={
        "کباب":"homeFoods",
        "غذا":"foodList",
        "پیتزا":"pizzaList",
        "آبمیوه":"drinkList"
    };

    Object.values(boxes).forEach(id=>{
        document.getElementById(id).innerHTML="";
    });

    data.foods.forEach((food,index)=>{

        let boxId=boxes[food.category];

        if(!boxId)return;

        let box=document.getElementById(boxId);

        let div=document.createElement("div");
        div.className="food";

        div.innerHTML=`

            ${
                food.image
                ? `<img src="${food.image}">`
                : `<div>🍽️</div>`
            }

            <div>
                <h3>${food.name}</h3>

                <div class="price">
                    ${food.price || 0} افغانی
                </div>

                <p>${food.desc || ""}</p>
            </div>
        `;

        box.appendChild(div);
    });
}

function renderAdminFoods(){

    let box=document.getElementById("adminFoods");

    box.innerHTML="";

    data.foods.forEach((food,index)=>{

        let div=document.createElement("div");

        div.className="category";

        div.style.marginBottom="8px";
        div.style.width="100%";
        div.style.justifyContent="space-between";

        div.innerHTML=`

            <span>
                ${food.name}
                -
                ${food.price || 0} افغانی
            </span>

            <button class="btn btn-danger"
                    onclick="deleteFood(${index})">
                حذف
            </button>
        `;

        box.appendChild(div);
    });
}

function deleteFood(index){

    if(!confirm("این غذا حذف شود؟"))return;

    data.foods.splice(index,1);

    saveData();
    render();
}

function saveInfo(){

    let name=document.getElementById("nameInput").value.trim();

    if(name){
        data.name=name;
    }

    let logo=document.getElementById("logoInput");

    if(logo.files[0]){

        let reader=new FileReader();

        reader.onload=function(e){

            data.logo=e.target.result;
            saveData();
            render();
        };

        reader.readAsDataURL(logo.files[0]);
    }

    let bg=document.getElementById("bgInput");

    if(bg.files[0]){

        let reader=new FileReader();

        reader.onload=function(e){

            data.background=e.target.result;
            saveData();
            render();
        };

        reader.readAsDataURL(bg.files[0]);
    }

    saveData();
    render();

    alert("اطلاعات ذخیره شد");
}

function saveAddress(){

    data.address=document.getElementById("address").value;
    data.mapLink=document.getElementById("mapLink").value;

    saveData();

    alert("آدرس ذخیره شد");
}

loadData();

</script>

</body>
</html>
