<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تست موجود / تمام شده</title>
<style>
body{font-family:Tahoma,Arial;padding:24px;background:#f5f5f5;max-width:700px;margin:auto}
.panel{background:#fff;padding:18px;border-radius:14px;margin:12px 0;box-shadow:0 2px 10px #0001}
button{font-family:inherit;border:0;border-radius:10px;padding:11px 16px;margin:4px;cursor:pointer}
#sold{background:#d62828;color:#fff}#available{background:#159447;color:#fff}
#order{background:#0757a8;color:#fff;width:100%;font-size:17px}
#order:disabled{background:#aaa;cursor:not-allowed}
.status{display:block;font-weight:bold;margin:8px 0;font-size:15px}
</style></head>
<body>
<h2>🧪 تست واقعی موجود / تمام‌شده</h2>
<div class="panel">
  <button id="sold">🔴 قرار دادن روی تمام‌شده</button>
  <button id="available">🟢 قرار دادن روی موجود</button>
</div>
<div class="panel">
  <div style="font-size:22px;font-weight:bold">کباب سیخی</div>
  <span id="status" class="status"></span>
  <button id="order">🛒 سفارش کباب سیخی</button>
  <div id="result" style="margin-top:12px"></div>
</div>
<script>
const KEY='hh_menu_data_v1';
const state={foods:[{id:1,name:'کباب سیخی',price:200,available:true,daily:false}],cart:[],waiter:false};
function read(){try{return JSON.parse(localStorage.getItem(KEY))||state}catch(e){return state}}
function write(d){localStorage.setItem(KEY,JSON.stringify(d))}
function getFood(){const d=read();d.foods=d.foods||[];let f=d.foods.find(x=>x.name==='کباب سیخی');if(!f){f={id:1,name:'کباب سیخی',price:200,available:true,daily:false};d.foods.push(f);write(d)}return f}
function render(){const f=getFood();const ok=f.available!==false;const s=document.getElementById('status');const b=document.getElementById('order');s.textContent=ok?'🟢 موجود':'🔴 تمام شده';s.style.color=ok?'#159447':'#d62828';b.disabled=!ok;b.textContent=ok?'🛒 سفارش کباب سیخی':'🔴 تمام شده — سفارش ممنوع';}
function setStock(ok){const d=read();d.foods=d.foods||[];let f=d.foods.find(x=>x.name==='کباب سیخی');if(!f){f={id:1,name:'کباب سیخی',price:200,daily:false};d.foods.push(f)}f.available=ok;write(d);render();document.getElementById('result').textContent=ok?'وضعیت به موجود تغییر کرد.':'وضعیت به تمام‌شده تغییر کرد.'}
document.getElementById('sold').onclick=()=>setStock(false);
document.getElementById('available').onclick=()=>setStock(true);
document.getElementById('order').onclick=()=>{const f=getFood();if(f.available===false){document.getElementById('result').textContent='❌ این غذا تمام شده و قابل سفارش نیست.';return}const d=read();d.cart=d.cart||[];d.cart.push({id:f.id,name:f.name,price:f.price,qty:1});write(d);document.getElementById('result').textContent='✅ سفارش با موفقیت وارد سبد آزمایشی شد.'};
render();
</script>
</body></html>
