<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت منوی حاجی حیدری</title><style>body{font-family:Tahoma,Arial;background:#f4f6f8;color:#17243b;margin:0}.wrap{max-width:1150px;margin:auto;padding:18px}.panel{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 8px 28px #07172f12}.head{background:#07172f;color:#fff;border-radius:16px;padding:18px;display:flex;justify-content:space-between;align-items:center}.btn{border:0;border-radius:10px;padding:10px 14px;background:#07172f;color:#fff;font-weight:800;cursor:pointer}.gold{background:#e4b84f;color:#07172f}.danger{background:#b52b2b}.ok{background:#197a4b}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field input,.field select,.field textarea{padding:11px;border:1px solid #d9dee6;border-radius:10px;font:inherit;width:100%;box-sizing:border-box}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.item{border:1px solid #e5e8ed;border-radius:13px;padding:12px;margin:8px 0}.thumb{width:100px;height:70px;object-fit:cover;border-radius:10px}.hide{display:none!important}.muted{color:#6b7280;font-size:13px}.statusmsg{min-height:22px;font-weight:700}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9999}.modalbox{background:#fff;border-radius:16px;padding:20px;max-width:700px;width:100%;max-height:90vh;overflow:auto}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="head"><div><h1>⚙️ مدیریت منوی حاجی حیدری</h1><div>مدیریت کامل منو</div></div><button class="btn gold" id="logoutBtn">خروج</button></div><section id="login" class="panel"><h2>ورود مدیر</h2><div class="grid"><div class="field"><label>ایمیل</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password"></div></div><button class="btn" id="loginBtn">ورود</button><p id="msg" class="statusmsg">آماده ورود.</p></section><main id="app" class="hide"><div class="panel row"><button class="btn" onclick="tab('site')">🎨 ظاهر و محتوا</button><button class="btn" onclick="tab('foods')">🍽️ غذاها</button><button class="btn" onclick="tab('cats')">📂 دسته‌ها</button><button class="btn" onclick="tab('orders')">🛒 سفارش‌ها</button><button class="btn" onclick="tab('waiter')">🔔 گارسون</button></div><section id="site" class="panel"><h2>🎨 ظاهر صفحه اصلی</h2><p>تنظیمات سایت</p></section><section id="foods" class="panel hide"><h2>🍽️ غذاها و پیتزاها</h2><div class="grid"><div class="field"><label>نام غذا</label><input id="fn"></div><div class="field"><label>قیمت عادی</label><input id="fp" type="number"></div><div class="field"><label>دسته</label><select id="fc"></select></div><div class="field"><label>توضیحات و ترکیبات</label><textarea id="fd" rows="3"></textarea></div><div class="field"><label>📷 عکس غذا</label><input id="food_file" type="file" accept="image/*"></div><div class="field"><label>وضعیت</label><select id="fs"><option value="available">🟢 موجود</option><option value="low">🟠 موجودی کم</option><option value="soldout">🔴 تمام شده</option><option value="soon">🔵 به‌زودی</option></select></div></div><label><input id="fdaily" type="checkbox"> غذای روز</label> <button class="btn gold" id="addFoodBtn">+ افزودن غذا</button><p id="foodMsg" class="statusmsg"></p><div id="foodList"></div></section><section id="cats" class="panel hide"><h2>📂 دسته‌ها</h2><div class="row"><input id="cn" placeholder="نام دسته"><button class="btn gold" id="addCatBtn">+ افزودن</button></div><div id="catList"></div></section><section id="orders" class="panel hide"><h2>🛒 سفارش‌ها</h2><div id="orderList"></div></section><section id="waiter" class="panel hide"><h2>🔔 فراخوان گارسون</h2><div id="waiterList"></div></section></main></div><div id="editModal" class="modal hide"><div class="modalbox"><h2>✏️ ویرایش غذا</h2><input id="editId" type="hidden"><div class="grid"><div class="field"><label>نام غذا</label><input id="en"></div><div class="field"><label>قیمت</label><input id="ep" type="number"></div><div class="field"><label>دسته</label><select id="ec"></select></div><div class="field"><label>وضعیت</label><select id="es"><option value="available">🟢 موجود</option><option value="low">🟠 موجودی کم</option><option value="soldout">🔴 تمام شده</option><option value="soon">🔵 به‌زودی</option></select></div><div class="field"><label>توضیحات</label><textarea id="ed" rows="4"></textarea></div><div class="field"><label>📷 عکس جدید</label><input id="ef" type="file" accept="image/*"></div></div><label><input id="edaily" type="checkbox"> غذای روز</label><p id="editMsg" class="statusmsg"></p><div class="row"><button class="btn gold" id="saveEditBtn">💾 ذخیره تغییرات</button><button class="btn" id="closeEditBtn">انصراف</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://bjpascssizuskiujnzvf.supabase.co',K='sb_publishable_VMPe2QDMNfdwwAEAYQ2Y4A_3idOGTvr',B='food-images',$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;');const sb=supabase.createClient(U,K);let busy=false,foodsCache=[];function msg(id,t,c){$(id).textContent=t;$(id).style.color=c||''}function tab(id){['site','foods','cats','orders','waiter'].forEach(x=>$(x).classList.toggle('hide',x!==id))}function showApp(){$('login').classList.add('hide');$('app').classList.remove('hide')}async function login(){if(busy)return;busy=true;$('loginBtn').disabled=true;$('loginBtn').textContent='در حال ورود...';msg('msg','در حال اتصال...','#6b7280');try{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;showApp();await loadCats();await loadFoods($('fc').value);loadPizzaModule()}catch(e){msg('msg','❌ '+(e?.message||'اتصال به سرور برقرار نشد.'),'#b52b2b')}finally{busy=false;$('loginBtn').disabled=false;$('loginBtn').textContent='ورود'}}async function signOut(){await sb.auth.signOut();location.reload()}async function loadCats(){const r=await sb.from('categories').select('*').order('sort_order');if(r.error){msg('foodMsg','❌ '+r.error.message,'#b52b2b');return}const a=r.data||[];$('fc').innerHTML=a.filter(c=>c.active).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');$('ec').innerHTML=a.filter(c=>c.active).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');$('catList').innerHTML=a.map(c=>`<div class="item row"><input id="cat_${c.id}" value="${esc(c.name)}"><button class="btn gold" onclick="saveCat(${c.id})">💾 ذخیره</button><button class="btn danger" onclick="delCat(${c.id})">حذف</button></div>`).join('')}async function saveCat(id){const n=$('cat_'+id).value.trim();if(!n)return;const r=await sb.from('categories').update({name:n}).eq('id',id);if(r.error)alert(r.error.message);await loadCats()}async function addCat(){const n=$('cn').value.trim();if(!n)return;const r=await sb.from('categories').insert({name:n,active:true,sort_order:Date.now()});if(r.error)alert(r.error.message);$('cn').value='';await loadCats()}async function delCat(id){if(!confirm('حذف دسته؟'))return;const r=await sb.from('categories').delete().eq('id',id);if(r.error)alert(r.error.message);await loadCats()}async function upload(file){if(!file)return null;const p='site/'+crypto.randomUUID()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const r=await sb.storage.from(B).upload(p,file,{upsert:false});if(r.error)throw r.error;return sb.storage.from(B).getPublicUrl(p).data.publicUrl}async function addFood(){const v={name:$('fn').value.trim(),price:Number($('fp').value||0),category_id:Number($('fc').value),description:$('fd').value.trim()||null,stock_status:$('fs').value,daily:$('fdaily').checked,active:true,sort_order:Date.now()};if(!v.name||!v.category_id)return msg('foodMsg','❌ نام و دسته را کامل کنید.','#b52b2b');try{v.image_url=await upload($('food_file').files[0]);const r=await sb.from('foods').insert(v);if(r.error)throw r.error;$('fn').value='';$('fp').value='';$('fd').value='';$('food_file').value='';$('fdaily').checked=false;msg('foodMsg','✅ غذا ثبت شد.','#197a4b');await loadFoods($('fc').value)}catch(e){msg('foodMsg','❌ '+e.message,'#b52b2b')}}async function loadFoods(cat){let q=sb.from('foods').select('id,name,price,image_url,description,category_id,stock_status,active,daily,sort_order,categories(name)').order('sort_order',{ascending:true}).order('id',{ascending:true});if(cat)q=q.eq('category_id',cat);const r=await q;if(r.error){$('foodList').innerHTML='<p>'+esc(r.error.message)+'</p>';return}foodsCache=r.data||[];$('foodList').innerHTML=foodsCache.map((f,i)=>`<div class="item row">${f.image_url?`<img class="thumb" src="${esc(f.image_url)}" onerror="this.style.display='none'">`:'<div class="thumb">📷</div>'}<div style="flex:1"><b>${esc(f.name)}</b> — ${Number(f.price||0).toLocaleString('fa-AF')} افغانی<div class="muted">دسته: ${esc(f.categories?.name||'بدون دسته')} | ${esc(f.stock_status||'')} ${f.daily?'| غذای روز':''} | جایگاه: ${i+1}</div></div><button class="btn" onclick="moveFood(${f.id},'up',${f.category_id})">▲</button><button class="btn" onclick="moveFood(${f.id},'down',${f.category_id})">▼</button><button class="btn gold" onclick="openEdit(${f.id})">✏️ ویرایش</button><button class="btn ${f.active?'danger':'ok'}" onclick="toggleFood(${f.id},${f.active})">${f.active?'خاموش':'فعال'}</button><button class="btn danger" onclick="delFood(${f.id})">حذف</button></div>`).join('')||'<p class="muted">در این دسته غذایی نیست.</p>'}function openEdit(id){const f=foodsCache.find(x=>Number(x.id)===Number(id));if(!f)return alert('غذا پیدا نشد.');$('editId').value=f.id;$('en').value=f.name||'';$('ep').value=f.price??'';$('ec').value=f.category_id??'';$('es').value=f.stock_status||'available';$('ed').value=f.description||'';$('edaily').checked=!!f.daily;$('ef').value='';msg('editMsg','');$('editModal').classList.remove('hide')}function closeEdit(){$('editModal').classList.add('hide')}async function saveEdit(){const id=Number($('editId').value);const v={name:$('en').value.trim(),price:Number($('ep').value||0),category_id:Number($('ec').value),description:$('ed').value.trim()||null,stock_status:$('es').value,daily:$('edaily').checked};if(!v.name||!v.category_id)return msg('editMsg','❌ نام و دسته را کامل کنید.','#b52b2b');$('saveEditBtn').disabled=true;try{const file=$('ef').files[0];if(file)v.image_url=await upload(file);const r=await sb.from('foods').update(v).eq('id',id);if(r.error)throw r.error;msg('editMsg','✅ تغییرات ذخیره شد.','#197a4b');await loadFoods($('fc').value);setTimeout(closeEdit,500)}catch(e){msg('editMsg','❌ '+e.message,'#b52b2b')}finally{$('saveEditBtn').disabled=false}}async function toggleFood(id,active){const r=await sb.from('foods').update({active:!active}).eq('id',id);if(r.error)alert(r.error.message);await loadFoods($('fc').value)}async function delFood(id){if(!confirm('این غذا حذف شود؟'))return;const r=await sb.from('foods').delete().eq('id',id);if(r.error)alert(r.error.message);await loadFoods($('fc').value)}async function moveFood(id,dir,cat){const r=await sb.from('foods').select('id,sort_order').eq('category_id',cat).order('sort_order',{ascending:true}).order('id',{ascending:true});if(r.error)return alert(r.error.message);const a=r.data||[],i=a.findIndex(x=>Number(x.id)===Number(id)),j=dir==='up'?i-1:i+1;if(i<0||j<0||j>=a.length)return;const c=a[i],o=a[j],cv=Number(c.sort_order||0),ov=Number(o.sort_order||0);let u=await sb.from('foods').update({sort_order:ov}).eq('id',c.id);if(u.error)return alert(u.error.message);u=await sb.from('foods').update({sort_order:cv}).eq('id',o.id);if(u.error)return alert(u.error.message);await loadFoods(cat)}function loadPizzaModule(){if(window.__pizzaModuleLoaded)return;window.__pizzaModuleLoaded=true;const s=document.createElement('script');s.src='./pizza-sizes.js';s.async=true;document.body.appendChild(s)}$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('logoutBtn').onclick=signOut;$('fc').onchange=e=>loadFoods(e.target.value);$('addFoodBtn').onclick=addFood;$('addCatBtn').onclick=addCat;$('closeEditBtn').onclick=closeEdit;$('saveEditBtn').onclick=saveEdit;</script><script src="./pizza-sizes.js"></script><script src="pizza-admin-fix.js"></script></body></html>
