<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت منوی حاجی حیدری</title><style>:root{--b:#07172f;--g:#d8b45a;--bg:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:#18243a}.wrap{max-width:1100px;margin:auto;padding:20px}.head{background:var(--b);color:#fff;border-radius:22px;padding:20px;display:flex;justify-content:space-between;align-items:center}.head h1{margin:0}.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--b);color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.gold{background:var(--g);color:var(--b)}.panel{background:#fff;border-radius:18px;padding:18px;margin-top:18px;box-shadow:0 8px 28px #07172f12}.tabs{display:flex;gap:8px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field input,.field select{padding:11px;border:1px solid #ddd;border-radius:10px;font:inherit}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.item{border:1px solid #e6e8ec;border-radius:14px;padding:14px;margin:9px 0}.muted{color:#6b7280}.danger{background:#b52b2b;color:#fff}.ok{background:#1f7a4d;color:#fff}.hide{display:none}.statusmsg{min-height:28px;margin:12px 0 0;font-weight:700}.stars{font-size:14px}.status{color:#fff;border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.available{background:#1f7a4d}.low{background:#f59e0b}.soldout{background:#b52b2b}.soon{background:#2563eb}.orderHead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.orderItems{background:#f6f8fa;border-radius:10px;padding:10px;margin:10px 0;line-height:1.9}.orderItems div{border-bottom:1px solid #e2e5e9;padding:4px 0}.orderItems div:last-child{border-bottom:0}@media(max-width:700px){.grid{grid-template-columns:1fr}.head{gap:10px;flex-direction:column;align-items:stretch}}</style></head><body><div class="wrap"><div class="head"><div><h1>⚙️ مدیریت منوی حاجی حیدری</h1><div style="color:#dbe2ee">غذاها، دسته‌ها، سفارش‌ها و نظرات</div></div><button class="btn gold" onclick="signOut()">خروج</button></div><div id="login" class="panel"><h2>ورود مدیر</h2><div class="grid"><div class="field"><label>ایمیل</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password"></div></div><button id="loginBtn" class="btn" style="margin-top:12px" type="button">ورود</button><p id="msg" class="statusmsg">آماده ورود.</p></div><div id="app" class="hide"><div class="panel tabs"><button class="btn" onclick="tab('foods')">🍽️ غذاها</button><button class="btn" onclick="tab('cats')">📂 دسته‌ها</button><button class="btn" onclick="tab('orders')">🛒 سفارش‌ها</button><button class="btn" onclick="tab('reviews')">⭐ نظرات</button></div><section id="foods" class="panel"><h2>غذاها</h2><div class="grid"><div class="field"><label>نام غذا</label><input id="fn"></div><div class="field"><label>قیمت</label><input id="fp" type="number"></div><div class="field"><label>دسته‌ای که غذا در آن نمایش داده شود</label><select id="fc"></select></div><div class="field"><label>آدرس عکس</label><input id="fi"></div><div class="field"><label>توضیح</label><input id="fd"></div><div class="field"><label>وضعیت</label><select id="fs"><option value="available">🟢 موجود</option><option value="low">🟠 موجودی کم</option><option value="soldout">🔴 تمام شده</option><option value="soon">🔵 به‌زودی</option></select></div></div><label><input id="fdaily" type="checkbox"> غذای روز</label><button class="btn gold" style="margin-top:12px" onclick="addFood()">+ افزودن غذا به دسته انتخاب‌شده</button><div id="foodList"></div></section><section id="cats" class="panel hide"><h2>دسته‌ها</h2><div class="row"><input id="cn" placeholder="نام دسته"><button class="btn gold" onclick="addCat()">+ افزودن دسته</button></div><div id="catList"></div></section><section id="orders" class="panel hide"><div class="orderHead"><h2>سفارش‌ها</h2><button class="btn gold" onclick="loadOrders()">↻ تازه‌سازی</button></div><div id="orderList"></div></section><section id="reviews" class="panel hide"><h2>نظرات مشتریان</h2><div id="reviewList"></div></section></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://bjpascssizuskiujnzvf.supabase.co',SUPABASE_KEY='sb_publishable_VMPe2QDMNfdwwAEAYQ2Y4A_3idOGTvr';const $=id=>document.getElementById(id);const setMsg=(t,c)=>{const m=$('msg');if(m){m.textContent=t;m.style.color=c||''}};let sb=null;function initSupabase(){if(!window.supabase){setMsg('❌ کتابخانه Supabase بارگذاری نشده است. اتصال اینترنت یا CDN را بررسی کنید.','#b52b2b');return false}try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);return true}catch(e){setMsg('❌ خطا در ساخت اتصال Supabase: '+(e.message||e),'#b52b2b');return false}}function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;')}const labels={available:'🟢 موجود',low:'🟠 موجودی کم',soldout:'🔴 تمام شده',soon:'🔵 به‌زودی'},next={available:'low',low:'soldout',soldout:'soon',soon:'available'};async function login(){const btn=$('loginBtn');if(!sb&&!initSupabase())return;const email=$('email').value.trim(),password=$('password').value;if(!email||!password){setMsg('❌ ایمیل و رمز عبور را وارد کنید.','#b52b2b');return}btn.disabled=true;setMsg('⏳ در حال بررسی اطلاعات ورود...');try{const r=await sb.auth.signInWithPassword({email,password});if(r.error){setMsg('❌ خطای ورود: '+r.error.message,'#b52b2b');return}if(!r.data||!r.data.session){setMsg('❌ ورود انجام شد ولی نشست ساخته نشد.','#b52b2b');return}setMsg('✅ ورود موفق شد؛ پنل در حال بارگذاری است.','#1f7a4d');await boot()}catch(e){setMsg('❌ خطای فنی: '+(e?.message||String(e)),'#b52b2b')}finally{btn.disabled=false}}$('loginBtn').addEventListener('click',login);$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});async function signOut(){if(sb)await sb.auth.signOut();location.reload()}async function boot(){if(!sb&&!initSupabase())return;const r=await sb.auth.getSession();if(!r.data.session){setMsg('❌ نشست مدیر پیدا نشد.','#b52b2b');return}$('login').classList.add('hide');$('app').classList.remove('hide');await loadCats();await loadFoods();await loadOrders();await loadReviews()}function tab(id){['foods','cats','orders','reviews'].forEach(x=>$(x).classList.toggle('hide',x!==id));if(id==='orders')loadOrders()}async function loadCats(){const r=await sb.from('categories').select('*').order('sort_order');if(r.error){$('catList').innerHTML='<p class="muted">'+esc(r.error.message)+'</p>';return}const data=r.data||[];$('fc').innerHTML=data.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');$('catList').innerHTML=data.map(c=>'<div class="item"><b>'+esc(c.name)+'</b></div>').join('')}async function addCat(){const n=$('cn').value.trim();if(!n)return;const r=await sb.from('categories').insert({name:n,active:true});if(r.error)alert(r.error.message);else{$('cn').value='';loadCats()}}async function addFood(){const v={name:$('fn').value.trim(),price:Number($('fp').value||0),category_id:Number($('fc').value),image_url:$('fi').value.trim()||null,description:$('fd').value.trim()||null,stock_status:$('fs').value,daily:$('fdaily').checked,active:true};if(!v.name||!v.price||!v.category_id)return alert('نام، قیمت و دسته را وارد کنید.');const r=await sb.from('foods').insert(v);if(r.error)alert(r.error.message);else{$('fn').value='';$('fp').value='';$('fi').value='';$('fd').value='';$('fdaily').checked=false;$('fs').value='available';loadFoods()}}async function loadFoods(){const r=await sb.from('foods').select('*,categories(name)').order('id',{ascending:false});if(r.error){$('foodList').innerHTML='<p class="muted">'+esc(r.error.message)+'</p>';return}const data=r.data||[];$('foodList').innerHTML=data.length?data.map(f=>'<div class="item"><b>'+esc(f.name)+'</b> — '+Number(f.price).toLocaleString('fa-AF')+' افغانی <span class="muted">('+esc(f.categories?.name||'بدون دسته')+')</span><div class="row" style="margin-top:8px"><button class="status '+(f.stock_status||'available')+'" onclick="cycleStock('+f.id+',\''+(f.stock_status||'available')+'\')">'+(labels[f.stock_status]||labels.available)+' ↻</button><button class="btn '+(f.active?'ok':'danger')+'" onclick="toggleActive('+f.id+','+!!f.active+')">'+(f.active?'فعال در منو':'خاموش')+'</button><button class="btn danger" onclick="delFood('+f.id+')">حذف</button></div></div>').join(''):'<p class="muted">هنوز غذایی ثبت نشده.</p>'}async function cycleStock(id,s){const r=await sb.from('foods').update({stock_status:next[s]||'available'}).eq('id',id);if(r.error)alert(r.error.message);else loadFoods()}async function toggleActive(id,v){const r=await sb.from('foods').update({active:!v}).eq('id',id);if(r.error)alert(r.error.message);else loadFoods()}async function delFood(id){if(!confirm('حذف غذا؟'))return;const r=await sb.from('foods').delete().eq('id',id);if(r.error)alert(r.error.message);else loadFoods()}async function loadOrders(){const r=await sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false});$('orderList').innerHTML=r.error?'<p class="muted">'+esc(r.error.message)+'</p>':'<p class="muted">'+((r.data||[]).length?'سفارش‌ها بارگذاری شدند.':'هنوز سفارشی ثبت نشده.')+'</p>'}async function loadReviews(){const r=await sb.from('reviews').select('*').order('created_at',{ascending:false});$('reviewList').innerHTML=r.error?'<p>'+esc(r.error.message)+'</p>':'<p class="muted">'+((r.data||[]).length?'نظرات بارگذاری شدند.':'نظری نیست.')+'</p>'}window.addEventListener('error',e=>{if($('msg')&&!$('msg').textContent.includes('خطای'))setMsg('❌ خطای JavaScript: '+e.message,'#b52b2b')});window.addEventListener('unhandledrejection',e=>setMsg('❌ خطای اتصال: '+(e.reason?.message||String(e.reason)),'#b52b2b'));if(initSupabase()){sb.auth.getSession().then(r=>{if(r.error)setMsg('❌ خطا در بررسی نشست: '+r.error.message,'#b52b2b');else if(r.data.session)boot()}).catch(e=>setMsg('❌ خطای فنی: '+(e.message||e),'#b52b2b'))}</script></body></html>
