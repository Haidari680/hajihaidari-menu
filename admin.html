<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت منوی حاجی حیدری</title><style>:root{--b:#07172f;--g:#e4b84f;--bg:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial;color:#17243b}.wrap{max-width:1150px;margin:auto;padding:18px}.head,.panel{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 8px 28px #07172f12}.head{background:var(--b);color:#fff;display:flex;justify-content:space-between;align-items:center}.head h1{margin:0}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--b);color:#fff;font-weight:800;cursor:pointer}.gold{background:var(--g);color:var(--b)}.danger{background:#b52b2b}.ok{background:#197a4b}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field input,.field select,.field textarea{padding:11px;border:1px solid #d9dee6;border-radius:10px;font:inherit;width:100%}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.item{border:1px solid #e5e8ed;border-radius:13px;padding:12px;margin:8px 0}.muted{color:#6b7280;font-size:13px}.thumb{width:100px;height:70px;object-fit:cover;border-radius:10px}.preview{max-width:180px;max-height:120px;border-radius:12px;display:none}.hide{display:none}.statusmsg{min-height:24px;font-weight:700}.slide{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center}.slide img{width:110px;height:75px;object-fit:cover;border-radius:10px}.catEdit{display:flex;gap:8px;align-items:center;flex:1}.catEdit input{padding:9px;border:1px solid #d9dee6;border-radius:9px;font:inherit;min-width:180px}@media(max-width:700px){.grid{grid-template-columns:1fr}.head{gap:10px;flex-direction:column;align-items:stretch}.slide{grid-template-columns:1fr}.slide img{width:100%;height:140px}.catEdit{width:100%}.catEdit input{min-width:0;flex:1}}</style></head><body><div class="wrap"><div class="head"><div><h1>⚙️ مدیریت منوی حاجی حیدری</h1><div>محتوای سایت، دسته‌ها، غذاها، سفارش‌ها و گارسون</div></div><button class="btn gold" onclick="signOut()">خروج</button></div><section id="login" class="panel"><h2>ورود مدیر</h2><div class="grid"><div class="field"><label>ایمیل</label><input id="email" type="email"></div><div class="field"><label>رمز عبور</label><input id="password" type="password"></div></div><button class="btn" id="loginBtn">ورود</button><p id="msg" class="statusmsg">آماده ورود.</p></section><main id="app" class="hide"><div class="panel row"><button class="btn" onclick="tab('site')">🎨 ظاهر و محتوا</button><button class="btn" onclick="tab('slides')">🖼️ اسلایدشو</button><button class="btn" onclick="tab('foods')">🍽️ غذاها</button><button class="btn" onclick="tab('cats')">📂 دسته‌ها</button><button class="btn" onclick="tab('orders')">🛒 سفارش‌ها</button><button class="btn" onclick="tab('waiter')">🔔 گارسون</button></div><section id="site" class="panel"><h2>🎨 ظاهر صفحه اصلی</h2><div class="grid"><div class="field"><label>عنوان سایت</label><input id="site_title"></div><div class="field"><label>زیرعنوان</label><input id="site_subtitle"></div><div class="field"><label>عنوان اصلی</label><input id="hero_title"></div><div class="field"><label>متن اصلی</label><input id="hero_text"></div><div class="field"><label>🏷️ لوگو</label><input id="logo_file" type="file" accept="image/*"><img id="logo_preview" class="preview"></div><div class="field"><label>🖼️ تصویر پس‌زمینه</label><input id="bg_file" type="file" accept="image/*"><img id="bg_preview" class="preview"></div></div><h3>📍 آدرس دو شعبه</h3><div class="grid"><div class="field"><label>نام شعبه اول</label><input id="branch1_name"></div><div class="field"><label>آدرس شعبه اول</label><input id="branch1_address"></div><div class="field"><label>🗺️ لینک نقشه شعبه اول</label><input id="branch1_map"></div><div class="field"><label>نام شعبه دوم</label><input id="branch2_name"></div><div class="field"><label>آدرس شعبه دوم</label><input id="branch2_address"></div><div class="field"><label>🗺️ لینک نقشه شعبه دوم</label><input id="branch2_map"></div></div><p><label><input id="cart_enabled" type="checkbox"> 🛒 سبد خرید فعال</label>　<label><input id="waiter_enabled" type="checkbox"> 🔔 فراخوان گارسون فعال</label></p><button class="btn gold" onclick="saveSite()">💾 ذخیره تنظیمات</button><p id="siteMsg" class="statusmsg"></p></section><section id="slides" class="panel hide"><h2>🖼️ اسلایدشو و متن‌های اسلاید</h2><div class="grid"><div class="field"><label>عکس اسلاید</label><input id="slide_file" type="file" accept="image/*"></div><div class="field"><label>عنوان اسلاید</label><input id="slide_title"></div><div class="field"><label>متن اسلاید</label><input id="slide_subtitle"></div><div class="field"><label>ترتیب</label><input id="slide_order" type="number" value="1"></div></div><button class="btn gold" onclick="addSlide()">+ افزودن اسلاید</button><div id="slideList"></div></section><section id="foods" class="panel hide"><h2>🍽️ غذاها</h2><div class="grid"><div class="field"><label>نام غذا</label><input id="fn"></div><div class="field"><label>قیمت</label><input id="fp" type="number"></div><div class="field"><label>دسته</label><select id="fc"></select></div><div class="field"><label>توضیح</label><input id="fd"></div><div class="field"><label>📷 عکس غذا</label><input id="food_file" type="file" accept="image/*"></div><div class="field"><label>وضعیت</label><select id="fs"><option value="available">🟢 موجود</option><option value="low">🟠 موجودی کم</option><option value="soldout">🔴 تمام شده</option><option value="soon">🔵 به‌زودی</option></select></div></div><label><input id="fdaily" type="checkbox"> غذای روز</label> <button class="btn gold" onclick="addFood()">+ افزودن غذا</button><p id="foodMsg" class="statusmsg"></p><div id="foodList"></div></section><section id="cats" class="panel hide"><h2>📂 مدیریت کامل دسته‌ها</h2><div class="row"><input id="cn" placeholder="نام دسته"><button class="btn gold" onclick="addCat()">+ افزودن</button></div><p id="catMsg" class="statusmsg"></p><div id="catList"></div></section><section id="orders" class="panel hide"><h2>🛒 سفارش‌ها</h2><button class="btn gold" onclick="loadOrders()">↻ تازه‌سازی</button><div id="orderList"></div></section><section id="waiter" class="panel hide"><h2>🔔 فراخوان گارسون</h2><button class="btn gold" onclick="loadWaiter()">↻ تازه‌سازی</button><div id="waiterList"></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://bjpascssizuskiujnzvf.supabase.co',K='sb_publishable_VMPe2QDMNfdwwAEAYQ2Y4A_3idOGTvr',B='food-images',$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');let sb=supabase.createClient(U,K);const keys=['site_title','site_subtitle','hero_title','hero_text','branch1_name','branch1_address','branch1_map','branch2_name','branch2_address','branch2_map','logo_url','home_background_url','cart_enabled','waiter_enabled'];function m(id,t,c){$(id).textContent=t;$(id).style.color=c||''}async function login(){let r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)return m('msg','❌ '+r.error.message,'#b52b2b');boot()}$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};async function signOut(){await sb.auth.signOut();location.reload()}async function boot(){let r=await sb.auth.getSession();if(!r.data.session)return;$('login').classList.add('hide');$('app').classList.remove('hide');await loadSite();await loadCats();await loadFoods();await loadSlides();await loadOrders();await loadWaiter();m('msg','✅ ورود موفق شد.','#197a4b')}function tab(id){['site','slides','foods','cats','orders','waiter'].forEach(x=>$(x).classList.toggle('hide',x!==id))}async function loadSite(){let r=await sb.from('site_settings').select('key,value');if(r.error)return m('siteMsg','❌ '+r.error.message,'#b52b2b');let d=Object.fromEntries((r.data||[]).map(x=>[x.key,x.value]));keys.forEach(k=>{if($(k))$(k).value=d[k]||''});cart_enabled.checked=d.cart_enabled!=='false';waiter_enabled.checked=d.waiter_enabled!=='false';if(d.logo_url){logo_preview.src=d.logo_url;logo_preview.style.display='block'}if(d.home_background_url){bg_preview.src=d.home_background_url;bg_preview.style.display='block'}}async function upload(file){if(!file)return null;let path='site/'+crypto.randomUUID()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');let r=await sb.storage.from(B).upload(path,file,{upsert:false});if(r.error)throw r.error;return sb.storage.from(B).getPublicUrl(path).data.publicUrl}async function saveSite(){try{let logo=await upload(logo_file.files[0]),bg=await upload(bg_file.files[0]),d={};keys.forEach(k=>{if($(k))d[k]=$(k).value});if(logo)d.logo_url=logo;if(bg)d.home_background_url=bg;d.cart_enabled=cart_enabled.checked?'true':'false';d.waiter_enabled=waiter_enabled.checked?'true':'false';for(let [key,value] of Object.entries(d)){let r=await sb.from('site_settings').upsert({key,value},{onConflict:'key'});if(r.error)throw r.error}m('siteMsg','✅ تنظیمات ذخیره شد.','#197a4b');loadSite()}catch(e){m('siteMsg','❌ '+e.message,'#b52b2b')}}async function addSlide(){try{let image=await upload(slide_file.files[0]),r=await sb.from('site_slides').insert({sort_order:Number(slide_order.value||0),image_url:image,title:slide_title.value.trim(),subtitle:slide_subtitle.value.trim(),active:true});if(r.error)throw r.error;slide_file.value='';slide_title.value='';slide_subtitle.value='';loadSlides()}catch(e){alert(e.message)}}async function loadSlides(){let r=await sb.from('site_slides').select('*').order('sort_order');slideList.innerHTML=r.error?'<p>'+esc(r.error.message)+'</p>':(r.data||[]).map(s=>`<div class="item slide">${s.image_url?`<img src="${esc(s.image_url)}">`:'<div>بدون عکس</div>'}<div><b>${esc(s.title)}</b><div class="muted">${esc(s.subtitle)}</div><button class="btn ${s.active?'danger':'ok'}" onclick="toggleSlide(${s.id},${s.active})">${s.active?'خاموش':'فعال'}</button> <button class="btn danger" onclick="delSlide(${s.id})">حذف</button></div></div>`).join('')||'<p class="muted">اسلایدی نیست.</p>'}async function toggleSlide(id,v){let r=await sb.from('site_slides').update({active:!v}).eq('id',id);if(r.error)alert(r.error.message);loadSlides()}async function delSlide(id){if(confirm('حذف اسلاید؟')){let r=await sb.from('site_slides').delete().eq('id',id);if(r.error)alert(r.error.message);loadSlides()}}async function loadCats(){let r=await sb.from('categories').select('*').order('sort_order');if(r.error)return catList.innerHTML='<p>'+esc(r.error.message)+'</p>';fc.innerHTML=(r.data||[]).filter(c=>c.active).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');catList.innerHTML=(r.data||[]).map(c=>`<div class="item row"><div class="catEdit"><input id="cat_${c.id}" value="${esc(c.name)}" aria-label="نام دسته ${esc(c.name)}" disabled></div><button class="btn gold" onclick="editCat(${c.id})">ویرایش</button><button class="btn ${c.active?'danger':'ok'}" onclick="toggleCat(${c.id},${c.active})">${c.active?'خاموش':'فعال'}</button><button class="btn danger" onclick="delCat(${c.id})">حذف</button></div>`).join('')}function editCat(id){let input=$('cat_'+id),button=event.currentTarget;if(!input)return;if(input.disabled){input.disabled=false;input.focus();input.select();button.textContent='💾 ذخیره';button.classList.add('ok');button.classList.remove('gold')}else saveCat(id)}async function saveCat(id){let input=$('cat_'+id),n=input?.value.trim();if(!input||!n)return m('catMsg','❌ نام دسته را وارد کنید.','#b52b2b');let r=await sb.from('categories').update({name:n}).eq('id',id);if(r.error)return m('catMsg','❌ ذخیره نام دسته نشد: '+r.error.message,'#b52b2b');m('catMsg','✅ نام دسته با موفقیت تغییر کرد.','#197a4b');await loadCats();await loadFoods()}async function addCat(){let n=cn.value.trim();if(!n)return;let r=await sb.from('categories').insert({name:n,active:true,sort_order:Date.now()});if(r.error)alert(r.error.message);else{cn.value='';loadCats()}}async function toggleCat(id,v){let r=await sb.from('categories').update({active:!v}).eq('id',id);if(r.error)alert(r.error.message);loadCats()}async function delCat(id){if(confirm('حذف دسته؟')){let r=await sb.from('categories').delete().eq('id',id);if(r.error)alert(r.error.message);loadCats()}}async function addFood(){let v={name:fn.value.trim(),price:Number(fp.value||0),category_id:Number(fc.value),description:fd.value.trim()||null,stock_status:fs.value,daily:fdaily.checked,active:true};if(!v.name||!v.price||!v.category_id)return m('foodMsg','❌ نام، قیمت و دسته را کامل کنید.','#b52b2b');try{v.image_url=await upload(food_file.files[0]);let r=await sb.from('foods').insert(v);if(r.error)throw r.error;fn.value='';fp.value='';fd.value='';food_file.value='';fdaily.checked=false;m('foodMsg','✅ غذا با عکس و دسته ثبت شد.','#197a4b');loadFoods()}catch(e){m('foodMsg','❌ '+e.message,'#b52b2b')}}async function loadFoods(){let r=await sb.from('foods').select('id,name,price,image_url,stock_status,active,daily,categories(name)').order('id',{ascending:false});foodList.innerHTML=r.error?'<p>'+esc(r.error.message)+'</p>':(r.data||[]).map(f=>`<div class="item row">${f.image_url?`<img class="thumb" src="${esc(f.image_url)}">`:''}<div style="flex:1"><b>${esc(f.name)}</b> — ${Number(f.price).toLocaleString('fa-AF')} افغانی<div class="muted">دسته: ${esc(f.categories?.name||'بدون دسته')} | ${esc(f.stock_status)} ${f.daily?'| غذای روز':''}</div></div><button class="btn ${f.active?'danger':'ok'}" onclick="toggleFood(${f.id},${f.active})">${f.active?'خاموش':'فعال'}</button><button class="btn danger" onclick="delFood(${f.id})">حذف</button></div>`).join('')||'<p class="muted">غذایی نیست.</p>'}async function toggleFood(id,v){let r=await sb.from('foods').update({active:!v}).eq('id',id);if(r.error)alert(r.error.message);loadFoods()}async function delFood(id){if(confirm('حذف غذا؟')){let r=await sb.from('foods').delete().eq('id',id);if(r.error)alert(r.error.message);loadFoods()}}async function loadOrders(){let r=await sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false});orderList.innerHTML=r.error?'<p>'+esc(r.error.message)+'</p>':(r.data||[]).map(o=>`<div class="item"><b>${esc(o.order_no)}</b> — ${esc(o.customer_name||'بدون نام')} — ${Number(o.total).toLocaleString('fa-AF')} افغانی<div class="muted">${esc(o.table_location||'')}</div></div>`).join('')||'<p class="muted">سفارشی نیست.</p>'}async function loadWaiter(){let r=await sb.from('waiter_calls').select('*').order('created_at',{ascending:false});waiterList.innerHTML=r.error?'<p>'+esc(r.error.message)+'</p>':(r.data||[]).filter(x=>x.status!=='done').map(x=>`<div class="item"><b>🔔 ${esc(x.table_location||'میز نامشخص')}</b><div class="muted">${new Date(x.created_at).toLocaleString('fa-AF')}</div><button class="btn ok" onclick="doneWaiter(${x.id})">انجام شد</button></div>`).join('')||'<p class="muted">فراخوانی نیست.</p>'}async function doneWaiter(id){let r=await sb.from('waiter_calls').update({status:'done'}).eq('id',id);if(r.error)alert(r.error.message);loadWaiter()}sb.auth.getSession().then(r=>{if(r.data.session)boot()})</script></body></html>
