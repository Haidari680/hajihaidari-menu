<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت منوی حاجی حیدری</title><style>:root{--b:#07172f;--g:#d8b45a;--bg:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:#18243a}.wrap{max-width:1100px;margin:auto;padding:20px}.head{background:var(--b);color:#fff;border-radius:22px;padding:20px;display:flex;justify-content:space-between;align-items:center}.head h1{margin:0}.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--b);color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.gold{background:var(--g);color:var(--b)}.panel{background:#fff;border-radius:18px;padding:18px;margin-top:18px;box-shadow:0 8px 28px #07172f12}.tabs{display:flex;gap:8px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field input,.field select{padding:11px;border:1px solid #ddd;border-radius:10px;font:inherit}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.item{border:1px solid #e6e8ec;border-radius:14px;padding:14px;margin:9px 0}.muted{color:#6b7280}.danger{background:#b52b2b;color:#fff}.ok{background:#1f7a4d;color:#fff}.hide{display:none}.statusmsg{min-height:28px;margin:12px 0 0;font-weight:700}.status{color:#fff;border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.available{background:#1f7a4d}.low{background:#f59e0b}.soldout{background:#b52b2b}.soon{background:#2563eb}.preview{max-width:180px;max-height:140px;border-radius:12px;object-fit:cover;display:none;border:1px solid #ddd}.uploadbox{border:1px dashed #b8c2cf;border-radius:12px;padding:12px;background:#fafbfd}.foodimg{width:80px;height:60px;object-fit:cover;border-radius:10px;vertical-align:middle;margin-left:8px}.orderHead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}.head{gap:10px;flex-direction:column;align-items:stretch}}</style></head><body><div class="wrap"><div class="head"><div><h1>⚙️ مدیریت منوی حاجی حیدری</h1><div style="color:#dbe2ee">غذاها، دسته‌ها، سفارش‌ها و نظرات</div></div><button class="btn gold" onclick="signOut()">خروج</button></div><div id="login" class="panel"><h2>ورود مدیر</h2><div class="grid"><div class="field"><label>ایمیل</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password"></div></div><button id="loginBtn" class="btn" style="margin-top:12px" type="button">ورود</button><p id="msg" class="statusmsg">آماده ورود.</p></div><div id="app" class="hide"><div class="panel tabs"><button class="btn" onclick="tab('foods')">🍽️ غذاها</button><button class="btn" onclick="tab('cats')">📂 دسته‌ها</button><button class="btn" onclick="tab('orders')">🛒 سفارش‌ها</button><button class="btn" onclick="tab('reviews')">⭐ نظرات</button></div><section id="foods" class="panel"><h2>غذاها</h2><div class="grid"><div class="field"><label>نام غذا</label><input id="fn"></div><div class="field"><label>قیمت</label><input id="fp" type="number"></div><div class="field"><label>دسته‌ای که غذا در آن نمایش داده شود</label><select id="fc"></select></div><div class="field"><label>توضیح</label><input id="fd"></div><div class="field uploadbox"><label>📷 عکس غذا</label><input id="file" type="file" accept="image/*"><small class="muted">عکس را از کامپیوتر انتخاب کن؛ قبل از ذخیره کوچک و فشرده می‌شود.</small><img id="preview" class="preview" alt="پیش‌نمایش"></div><div class="field"><label>وضعیت</label><select id="fs"><option value="available">🟢 موجود</option><option value="low">🟠 موجودی کم</option><option value="soldout">🔴 تمام شده</option><option value="soon">🔵 به‌زودی</option></select></div></div><label><input id="fdaily" type="checkbox"> غذای روز</label><button id="addFoodBtn" class="btn gold" style="margin-top:12px" onclick="addFood()">+ افزودن غذا به دسته انتخاب‌شده</button><p id="foodMsg" class="statusmsg"></p><div id="foodList"></div></section><section id="cats" class="panel hide"><h2>دسته‌ها</h2><div class="row"><input id="cn" placeholder="نام دسته"><button class="btn gold" onclick="addCat()">+ افزودن دسته</button></div><div id="catList"></div></section><section id="orders" class="panel hide"><div class="orderHead"><h2>سفارش‌ها</h2><button class="btn gold" onclick="loadOrders()">↻ تازه‌سازی</button></div><div id="orderList"></div></section><section id="reviews" class="panel hide"><h2>نظرات مشتریان</h2><div id="reviewList"></div></section></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://bjpascssizuskiujnzvf.supabase.co',SUPABASE_KEY='sb_publishable_VMPe2QDMNfdwwAEAYQ2Y4A_3idOGTvr',BUCKET='food-images',$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;'),labels={available:'🟢 موجود',low:'🟠 موجودی کم',soldout:'🔴 تمام شده',soon:'🔵 به‌زودی'},next={available:'low',low:'soldout',soldout:'soon',soon:'available'};let sb=null;function setMsg(t,c){$('msg').textContent=t;$('msg').style.color=c||''}function foodMsg(t,c){$('foodMsg').textContent=t;$('foodMsg').style.color=c||''}function init(){if(!window.supabase){setMsg('❌ کتابخانه Supabase بارگذاری نشده است.','#b52b2b');return false}try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);return true}catch(e){setMsg('❌ خطا در اتصال Supabase: '+e.message,'#b52b2b');return false}}async function login(){if(!sb&&!init())return;const email=$('email').value.trim(),password=$('password').value;if(!email||!password){setMsg('❌ ایمیل و رمز عبور را وارد کنید.','#b52b2b');return}const b=$('loginBtn');b.disabled=true;setMsg('⏳ در حال بررسی اطلاعات ورود...');try{const r=await sb.auth.signInWithPassword({email,password});if(r.error){setMsg('❌ خطای ورود: '+r.error.message,'#b52b2b');return}if(!r.data.session){setMsg('❌ نشست ورود ساخته نشد.','#b52b2b');return}await boot()}catch(e){setMsg('❌ خطای فنی: '+(e.message||e),'#b52b2b')}finally{b.disabled=false}}$('loginBtn').addEventListener('click',login);$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});async function signOut(){if(sb)await sb.auth.signOut();location.reload()}async function boot(){if(!sb&&!init())return;const r=await sb.auth.getSession();if(!r.data.session){setMsg('❌ نشست مدیر پیدا نشد.','#b52b2b');return}$('login').classList.add('hide');$('app').classList.remove('hide');await loadCats();await loadFoods();await loadOrders();await loadReviews();setMsg('✅ ورود موفق شد.','#1f7a4d')}function tab(id){['foods','cats','orders','reviews'].forEach(x=>$(x).classList.toggle('hide',x!==id));if(id==='orders')loadOrders()}async function loadCats(){const r=await sb.from('categories').select('*').order('sort_order');if(r.error){$('catList').innerHTML='<p class="muted">'+esc(r.error.message)+'</p>';return}const d=r.data||[];$('fc').innerHTML=d.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');$('catList').innerHTML=d.map(c=>'<div class="item"><b>'+esc(c.name)+'</b></div>').join('')}async function addCat(){const n=$('cn').value.trim();if(!n)return;const r=await sb.from('categories').insert({name:n,active:true});if(r.error)alert(r.error.message);else{$('cn').value='';await loadCats()}}$('file').addEventListener('change',()=>{const f=$('file').files[0],p=$('preview');if(!f){p.style.display='none';return}p.src=URL.createObjectURL(f);p.style.display='block'});function resizeImage(file,max=900,quality=.72){return new Promise((resolve,reject)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;if(w>max||h>max){const scale=Math.min(max/w,max/h);w=Math.round(w*scale);h=Math.round(h*scale)}const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d',{alpha:false});ctx.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('فشرده‌سازی عکس انجام نشد')),'image/webp',quality)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('عکس قابل خواندن نیست'))};img.src=url})}async function uploadImage(file){if(!file)return null;const blob=await resizeImage(file);const path=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2))+'.webp';const r=await sb.storage.from(BUCKET).upload(path,blob,{upsert:false,contentType:'image/webp',cacheControl:'31536000'});if(r.error)throw r.error;return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl}async function addFood(){const v={name:$('fn').value.trim(),price:Number($('fp').value||0),category_id:Number($('fc').value),description:$('fd').value.trim()||null,stock_status:$('fs').value,daily:$('fdaily').checked,active:true};if(!v.name||!v.price||!v.category_id){foodMsg('❌ نام، قیمت و دسته را وارد کنید.','#b52b2b');return}const btn=$('addFoodBtn');btn.disabled=true;foodMsg('⏳ عکس در حال سبک‌سازی و غذا در حال ثبت...');try{const file=$('file').files[0];v.image_url=await uploadImage(file);const r=await sb.from('foods').insert(v);if(r.error)throw r.error;$('fn').value='';$('fp').value='';$('fd').value='';$('file').value='';$('preview').style.display='none';$('fdaily').checked=false;$('fs').value='available';foodMsg('✅ غذا و عکس سبک با موفقیت ثبت شد.','#1f7a4d');await loadFoods()}catch(e){foodMsg('❌ خطا: '+(e.message||e),'#b52b2b')}finally{btn.disabled=false}}async function loadFoods(){const r=await sb.from('foods').select('id,name,price,image_url,stock_status,active,categories(name)').order('id',{ascending:false});if(r.error){$('foodList').innerHTML='<p class="muted">'+esc(r.error.message)+'</p>';return}const d=r.data||[];$('foodList').innerHTML=d.length?d.map(f=>'<div class="item">'+(f.image_url?'<img class="foodimg" loading="lazy" decoding="async" src="'+esc(f.image_url)+'">':'')+'<b>'+esc(f.name)+'</b> — '+Number(f.price).toLocaleString('fa-AF')+' افغانی <span class="muted">('+esc(f.categories?.name||'بدون دسته')+')</span><div class="row" style="margin-top:8px"><button class="status '+(f.stock_status||'available')+'" onclick="cycleStock('+f.id+',\''+(f.stock_status||'available')+'\')">'+(labels[f.stock_status]||labels.available)+' ↻</button><button class="btn '+(f.active?'ok':'danger')+'" onclick="toggleActive('+f.id+','+!!f.active+')">'+(f.active?'فعال در منو':'خاموش')+'</button><button class="btn danger" onclick="delFood('+f.id+')">حذف</button></div></div>').join(''):'<p class="muted">هنوز غذایی ثبت نشده.</p>'}async function cycleStock(id,s){const r=await sb.from('foods').update({stock_status:next[s]||'available'}).eq('id',id);if(r.error)alert(r.error.message);else loadFoods()}async function toggleActive(id,v){const r=await sb.from('foods').update({active:!v}).eq('id',id);if(r.error)alert(r.error.message);else loadFoods()}async function delFood(id){if(!confirm('حذف غذا؟'))return;const r=await sb.from('foods').delete().eq('id',id);if(r.error)alert(r.error.message);else loadFoods()}async function loadOrders(){const r=await sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false});$('orderList').innerHTML=r.error?'<p class="muted">'+esc(r.error.message)+'</p>':'<p class="muted">'+((r.data||[]).length?'سفارش‌ها بارگذاری شدند.':'هنوز سفارشی ثبت نشده.')+'</p>'}async function loadReviews(){const r=await sb.from('reviews').select('*').order('created_at',{ascending:false});$('reviewList').innerHTML=r.error?'<p>'+esc(r.error.message)+'</p>':'<p class="muted">'+((r.data||[]).length?'نظرات بارگذاری شدند.':'نظری نیست.')+'</p>'}window.addEventListener('error',e=>{if($('msg'))setMsg('❌ خطای JavaScript: '+e.message,'#b52b2b')});window.addEventListener('unhandledrejection',e=>{if($('msg'))setMsg('❌ خطای اتصال: '+(e.reason?.message||String(e.reason)),'#b52b2b')});if(init())sb.auth.getSession().then(r=>{if(r.error)setMsg('❌ خطا در بررسی نشست: '+r.error.message,'#b52b2b');else if(r.data.session)boot()});</script></body></html>
