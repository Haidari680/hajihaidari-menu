<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت منوی حاجی حیدری</title><style>:root{--b:#07172f;--g:#d8b45a;--bg:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:#18243a}.wrap{max-width:1100px;margin:auto;padding:20px}.head{background:var(--b);color:#fff;border-radius:22px;padding:20px;display:flex;justify-content:space-between;align-items:center}.head h1{margin:0}.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--b);color:#fff;font-weight:800;cursor:pointer}.gold{background:var(--g);color:var(--b)}.panel{background:#fff;border-radius:18px;padding:18px;margin-top:18px;box-shadow:0 8px 28px #07172f12}.tabs{display:flex;gap:8px;overflow:auto}.tabs button{white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field input,.field select,.field textarea{padding:11px;border:1px solid #ddd;border-radius:10px;font:inherit}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.item{border:1px solid #e6e8ec;border-radius:14px;padding:14px;margin:9px 0}.muted{color:#6b7280}.danger{background:#b52b2b;color:#fff}.ok{background:#1f7a4d;color:#fff}.hide{display:none}.stars{font-size:14px}.status{color:#fff;border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.available{background:#1f7a4d}.low{background:#f59e0b}.soldout{background:#b52b2b}.soon{background:#2563eb}.orderHead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.orderItems{background:#f6f8fa;border-radius:10px;padding:10px;margin:10px 0;line-height:1.9}.orderItems div{border-bottom:1px solid #e2e5e9;padding:4px 0}.orderItems div:last-child{border-bottom:0}@media(max-width:700px){.grid{grid-template-columns:1fr}.head{gap:10px;flex-direction:column;align-items:stretch}}</style></head><body><div class="wrap"><div class="head"><div><h1>⚙️ مدیریت منوی حاجی حیدری</h1><div style="color:#dbe2ee">غذاها، دسته‌ها، سفارش‌ها و نظرات</div></div><button class="btn gold" onclick="signOut()">خروج</button></div><div id="login" class="panel"><h2>ورود مدیر</h2><div class="grid"><div class="field"><label>ایمیل</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password"></div></div><button id="loginBtn" class="btn" style="margin-top:12px" onclick="login()">ورود</button><p id="msg" class="muted" style="min-height:24px"></p></div><div id="app" class="hide"><div class="panel tabs"><button class="btn" onclick="tab('foods')">🍽️ غذاها</button><button class="btn" onclick="tab('cats')">📂 دسته‌ها</button><button class="btn" onclick="tab('orders')">🛒 سفارش‌ها</button><button class="btn" onclick="tab('reviews')">⭐ نظرات</button></div><section id="foods" class="panel"><h2>غذاها</h2><div class="grid"><div class="field"><label>نام غذا</label><input id="fn"></div><div class="field"><label>قیمت</label><input id="fp" type="number"></div><div class="field"><label>دسته‌ای که غذا در آن نمایش داده شود</label><select id="fc"></select></div><div class="field"><label>آدرس عکس</label><input id="fi"></div><div class="field"><label>توضیح</label><input id="fd"></div><div class="field"><label>وضعیت</label><select id="fs"><option value="available">🟢 موجود</option><option value="low">🟠 موجودی کم</option><option value="soldout">🔴 تمام شده</option><option value="soon">🔵 به‌زودی</option></select></div></div><label><input id="fdaily" type="checkbox"> غذای روز</label><button class="btn gold" style="margin-top:12px" onclick="addFood()">+ افزودن غذا به دسته انتخاب‌شده</button><div id="foodList"></div></section><section id="cats" class="panel hide"><h2>دسته‌ها</h2><div class="row"><input id="cn" placeholder="نام دسته"><button class="btn gold" onclick="addCat()">+ افزودن دسته</button></div><div id="catList"></div></section><section id="orders" class="panel hide"><div class="orderHead"><h2>سفارش‌ها</h2><button class="btn gold" onclick="loadOrders()">↻ تازه‌سازی</button></div><div id="orderList"></div></section><section id="reviews" class="panel hide"><h2>نظرات مشتریان</h2><div id="reviewList"></div></section></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://bjpascssizuskiujnzvf.supabase.co',KEY='sb_publishable_VMPe2QDMNfdwwAEAYQ2Y4A_3idOGTvr',sb=supabase.createClient(URL,KEY);const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');const labels={available:'🟢 موجود',low:'🟠 موجودی کم',soldout:'🔴 تمام شده',soon:'🔵 به‌زودی'};const next={available:'low',low:'soldout',soldout:'soon',soon:'available'};const orderLabels={new:'جدید',accepted:'تأیید شد',preparing:'در حال آماده‌سازی',ready:'آماده تحویل',completed:'تکمیل شد',cancelled:'لغو شد'};async function login(){const msg=$('msg'),btn=$('loginBtn');msg.textContent='در حال بررسی اطلاعات ورود...';msg.style.color='';btn.disabled=true;try{const email=$('email').value.trim(),password=$('password').value;if(!email||!password){msg.textContent='❌ ایمیل و رمز عبور را وارد کنید.';return}let{data,error}=await sb.auth.signInWithPassword({email,password});if(error){msg.textContent='❌ خطای ورود: '+error.message;msg.style.color='#b52b2b';return}if(!data?.session){msg.textContent='❌ ورود انجام شد ولی نشست کاربر ساخته نشد.';msg.style.color='#b52b2b';return}msg.textContent='✅ ورود موفق شد؛ در حال باز کردن پنل...';msg.style.color='#1f7a4d';await boot()}catch(e){msg.textContent='❌ خطای فنی: '+(e?.message||String(e));msg.style.color='#b52b2b'}finally{btn.disabled=false}}async function signOut(){await sb.auth.signOut();location.reload()}async function boot(){let s=await sb.auth.getSession();if(!s.data.session)return;$('login').classList.add('hide');$('app').classList.remove('hide');await loadCats();await loadFoods();await loadOrders();await loadReviews()}function tab(id){['foods','cats','orders','reviews'].forEach(x=>$(x).classList.toggle('hide',x!==id));if(id==='orders')loadOrders()}async function loadCats(){let{data,error}=await sb.from('categories').select('*').order('sort_order');if(error){alert(error.message);return}fc.innerHTML=data.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');catList.innerHTML=data.map(c=>`<div class="item"><b>${esc(c.name)}</b><button class="btn danger" style="float:left" onclick="delCat(${c.id})">حذف</button></div>`).join('')}async function addCat(){let n=cn.value.trim();if(!n)return;let{error}=await sb.from('categories').insert({name:n,active:true});if(error)alert(error.message);else{cn.value='';await loadCats()}}async function delCat(id){if(!confirm('حذف دسته؟'))return;let{error}=await sb.from('categories').delete().eq('id',id);if(error)alert(error.message);else{await loadCats();await loadFoods()}}async function addFood(){let v={name:fn.value.trim(),price:Number(fp.value||0),category_id:Number(fc.value),image_url:fi.value.trim()||null,description:fd.value.trim()||null,stock_status:fs.value,daily:fdaily.checked,active:true};if(!v.name||!v.price||!v.category_id)return alert('نام، قیمت و دسته را وارد کنید.');let{error}=await sb.from('foods').insert(v);if(error)alert(error.message);else{fn.value='';fp.value='';fi.value='';fd.value='';fdaily.checked=false;fs.value='available';await loadFoods()}}async function loadFoods(){let{data,error}=await sb.from('foods').select('*,categories(name)').order('id',{ascending:false});if(error){foodList.innerHTML='<p class="muted">خطا در بارگذاری غذاها.</p>';return}foodList.innerHTML=data.length?data.map(f=>`<div class="item"><b>${esc(f.name)}</b> — ${Number(f.price).toLocaleString('fa-AF')} افغانی <span class="muted">(${esc(f.categories?.name||'بدون دسته')})</span><div class="row" style="margin-top:8px"><button class="status ${f.stock_status||'available'}" onclick="cycleStock(${f.id},'${f.stock_status||'available'}')">${labels[f.stock_status]||labels.available} ↻</button><button class="btn" onclick="toggleDaily(${f.id},${!!f.daily})">${f.daily?'غذای روز ✓':'غذای روز'}</button><button class="btn ${f.active?'ok':'danger'}" onclick="toggleActive(${f.id},${!!f.active})">${f.active?'فعال در منو':'خاموش'}</button><button class="btn danger" onclick="delFood(${f.id})">حذف</button></div></div>`).join(''):'<p class="muted">هنوز غذایی ثبت نشده.</p>'}async function cycleStock(id,s){let{error}=await sb.from('foods').update({stock_status:next[s]||'available',updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else loadFoods()}async function toggleDaily(id,v){let{error}=await sb.from('foods').update({daily:!v,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else loadFoods()}async function toggleActive(id,v){let{error}=await sb.from('foods').update({active:!v,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else loadFoods()}async function delFood(id){if(!confirm('حذف غذا؟'))return;let{error}=await sb.from('foods').delete().eq('id',id);if(error)alert(error.message);else loadFoods()}async function loadOrders(){let{data,error}=await sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false});if(error){orderList.innerHTML='<p class="muted">سفارش‌ها در دسترس نیستند یا دسترسی مدیر تنظیم نشده.</p>';return}orderList.innerHTML=data.length?data.map(o=>`<div class="item"><div class="orderHead"><b>🧾 ${esc(o.order_no||'بدون شماره')}</b><span>${new Date(o.created_at).toLocaleString('fa-AF')}</span></div><p>👤 ${esc(o.customer_name||'')} — 🪑 ${esc(o.table_location||'')}</p><div class="orderItems">${(o.order_items||[]).length?(o.order_items||[]).map(i=>`<div>🍽️ ${esc(i.food_name||'غذا')} × ${i.quantity} — ${Number(i.unit_price||0).toLocaleString('fa-AF')} افغانی</div>`).join(''):'جزئیات اقلام ثبت نشده.'}</div><b>جمع: ${Number(o.total||0).toLocaleString('fa-AF')} افغانی</b><div class="row" style="margin-top:10px"><label>وضعیت:</label><select onchange="setOrder(${o.id},this.value)"><option value="new" ${o.status==='new'?'selected':''}>جدید</option><option value="accepted" ${o.status==='accepted'?'selected':''}>تأیید شد</option><option value="preparing" ${o.status==='preparing'?'selected':''}>در حال آماده‌سازی</option><option value="ready" ${o.status==='ready'?'selected':''}>آماده تحویل</option><option value="completed" ${o.status==='completed'?'selected':''}>تکمیل شد</option><option value="cancelled" ${o.status==='cancelled'?'selected':''}>لغو شد</option></select><span class="muted">${orderLabels[o.status]||o.status||''}</span></div></div>`).join(''):'<p class="muted">هنوز سفارشی ثبت نشده.</p>'}async function setOrder(id,status){let{error}=await sb.from('orders').update({status}).eq('id',id);if(error)alert(error.message);else loadOrders()}async function loadReviews(){let{data,error}=await sb.from('reviews').select('*').order('created_at',{ascending:false});if(error){reviewList.innerHTML='<p>'+esc(error.message)+'</p>';return}reviewList.innerHTML=data.length?data.map(r=>`<div class="item"><b>${esc(r.customer_name||'مهمان')}</b><div class="stars">غذا ${r.food_rating}/5 · نوشیدنی ${r.drink_rating}/5 · محیط ${r.environment_rating}/5 · مهمان‌نوازی ${r.hospitality_rating}/5 · کلی ${r.overall_rating}/5</div><p>${esc(r.comment||'')}</p><button class="btn ${r.approved?'danger':'ok'}" onclick="approve(${r.id},${!!r.approved})">${r.approved?'لغو تأیید':'تأیید'}</button></div>`).join(''):'<p class="muted">نظری نیست.</p>'}async function approve(id,v){let{error}=await sb.from('reviews').update({approved:!v}).eq('id',id);if(error)alert(error.message);else loadReviews()}sb.auth.getSession().then(({data})=>data.session?boot():null);</script></body></html>
