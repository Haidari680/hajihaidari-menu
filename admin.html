<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت منوی حاجی حیدری</title><style>body{font-family:Tahoma,Arial;background:#f4f6f8;color:#17243b;margin:0}.wrap{max-width:1150px;margin:auto;padding:18px}.panel{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 8px 28px #07172f12}.head{background:#07172f;color:#fff;border-radius:16px;padding:18px;display:flex;justify-content:space-between}.btn{border:0;border-radius:10px;padding:10px 14px;background:#07172f;color:#fff;font-weight:800;cursor:pointer}.gold{background:#e4b84f;color:#07172f}.danger{background:#b52b2b}.ok{background:#197a4b}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field input,.field select,.field textarea{padding:11px;border:1px solid #d9dee6;border-radius:10px;font:inherit;width:100%;box-sizing:border-box}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.item{border:1px solid #e5e8ed;border-radius:13px;padding:12px;margin:8px 0}.thumb{width:100px;height:70px;object-fit:cover;border-radius:10px}.hide{display:none}.muted{color:#6b7280;font-size:13px}.pizza-edit{margin-top:12px;padding:14px;background:#f8fafc;border-radius:12px;border:1px solid #dfe5ed}.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.sizebox{background:#fff;border:1px solid #d9dee6;border-radius:10px;padding:10px}.statusmsg{min-height:22px;font-weight:700}@media(max-width:700px){.grid,.sizes{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="head"><div><h1>⚙️ مدیریت منوی حاجی حیدری</h1><div>مدیریت کامل منو</div></div><button class="btn gold" onclick="signOut()">خروج</button></div><section id="login" class="panel"><h2>ورود مدیر</h2><div class="grid"><div class="field"><label>ایمیل</label><input id="email" type="email"></div><div class="field"><label>رمز عبور</label><input id="password" type="password"></div></div><button class="btn" id="loginBtn">ورود</button><p id="msg" class="statusmsg">آماده ورود.</p></section><main id="app" class="hide"><div class="panel row"><button class="btn" onclick="tab('site')">🎨 ظاهر و محتوا</button><button class="btn" onclick="tab('foods')">🍽️ غذاها</button><button class="btn" onclick="tab('cats')">📂 دسته‌ها</button><button class="btn" onclick="tab('orders')">🛒 سفارش‌ها</button><button class="btn" onclick="tab('waiter')">🔔 گارسون</button></div><section id="site" class="panel"><h2>🎨 ظاهر صفحه اصلی</h2><p>تنظیمات سایت</p></section><section id="foods" class="panel hide"><h2>🍽️ غذاها و پیتزاها</h2><div class="grid"><div class="field"><label>نام غذا</label><input id="fn"></div><div class="field"><label>قیمت عادی</label><input id="fp" type="number"></div><div class="field"><label>دسته</label><select id="fc" onchange="loadFoods(this.value)"></select></div><div class="field"><label>توضیحات و ترکیبات</label><textarea id="fd" rows="3"></textarea></div><div class="field"><label>📷 عکس غذا</label><input id="food_file" type="file" accept="image/*"></div><div class="field"><label>وضعیت</label><select id="fs"><option value="available">🟢 موجود</option><option value="low">🟠 موجودی کم</option><option value="soldout">🔴 تمام شده</option><option value="soon">🔵 به‌زودی</option></select></div></div><label><input id="fdaily" type="checkbox"> غذای روز</label> <button class="btn gold" onclick="addFood()">+ افزودن غذا</button><p id="foodMsg" class="statusmsg"></p><div id="foodList"></div></section><section id="cats" class="panel hide"><h2>📂 دسته‌ها</h2><div class="row"><input id="cn" placeholder="نام دسته"><button class="btn gold" onclick="addCat()">+ افزودن</button></div><div id="catList"></div></section><section id="orders" class="panel hide"><h2>🛒 سفارش‌ها</h2><div id="orderList"></div></section><section id="waiter" class="panel hide"><h2>🔔 فراخوان گارسون</h2><div id="waiterList"></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://bjpascssizuskiujnzvf.supabase.co',K='sb_publishable_VMPe2QDMNfdwwAEAYQ2Y4A_3idOGTvr',B='food-images',$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');let sb=supabase.createClient(U,K);function m(id,t,c){$(id).textContent=t;$(id).style.color=c||''}async function login(){let r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)return m('msg','❌ '+r.error.message,'#b52b2b');boot()}$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};async function signOut(){await sb.auth.signOut();location.reload()}async function boot(){let r=await sb.auth.getSession();if(!r.data.session)return;$('login').classList.add('hide');$('app').classList.remove('hide');await loadCats();await loadFoods(fc.value);if(!window.__pizzaModuleLoaded){window.__pizzaModuleLoaded=true;let s=document.createElement('script');s.src='./pizza-sizes.js';s.async=true;s.onload=()=>window.__pizzaModuleReady=true;s.onerror=()=>window.__pizzaModuleReady=false;document.body.appendChild(s)}}function tab(id){['site','foods','cats','orders','waiter'].forEach(x=>$(x).classList.toggle('hide',x!==id))}async function loadCats(){let r=await sb.from('categories').select('*').order('sort_order');if(r.error){catList.innerHTML='<p>'+esc(r.error.message)+'</p>';return}fc.innerHTML=(r.data||[]).filter(c=>c.active).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');catList.innerHTML=(r.data||[]).map(c=>`<div class="item row"><input id="cat_${c.id}" value="${esc(c.name)}"><button class="btn gold" onclick="saveCat(${c.id})">💾 ذخیره</button><button class="btn danger" onclick="delCat(${c.id})">حذف</button></div>`).join('')}async function saveCat(id){let n=$('cat_'+id).value.trim();if(!n)return;let r=await sb.from('categories').update({name:n}).eq('id',id);if(r.error)alert(r.error.message);loadCats()}async function addCat(){let n=cn.value.trim();if(!n)return;let r=await sb.from('categories').insert({name:n,active:true,sort_order:Date.now()});if(r.error)alert(r.error.message);cn.value='';loadCats()}async function delCat(id){if(confirm('حذف دسته؟')){let r=await sb.from('categories').delete().eq('id',id);if(r.error)alert(r.error.message);loadCats()}}async function upload(file){if(!file)return null;let path='site/'+crypto.randomUUID()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');let r=await sb.storage.from(B).upload(path,file,{upsert:false});if(r.error)throw r.error;return sb.storage.from(B).getPublicUrl(path).data.publicUrl}async function addFood(){let v={name:fn.value.trim(),price:Number(fp.value||0),category_id:Number(fc.value),description:fd.value.trim()||null,stock_status:fs.value,daily:fdaily.checked,active:true,sort_order:Date.now()};if(!v.name||!v.category_id)return m('foodMsg','❌ نام و دسته را کامل کنید.','#b52b2b');try{v.image_url=await upload(food_file.files[0]);let r=await sb.from('foods').insert(v);if(r.error)throw r.error;fn.value='';fp.value='';fd.value='';food_file.value='';m('foodMsg','✅ غذا ثبت شد.','#197a4b');loadFoods(fc.value)}catch(e){m('foodMsg','❌ '+e.message,'#b52b2b')}}async function moveFood(id,direction,categoryId){try{let r=await sb.from('foods').select('id,sort_order').eq('category_id',categoryId).order('sort_order',{ascending:true}).order('id',{ascending:true});if(r.error)throw r.error;let a=r.data||[],i=a.findIndex(x=>x.id===id),j=direction==='up'?i-1:i+1;if(i<0||j<0||j>=a.length)return;let cur=a[i],other=a[j],cv=Number(cur.sort_order||0),ov=Number(other.sort_order||0);let u1=await sb.from('foods').update({sort_order:ov}).eq('id',cur.id);if(u1.error)throw u1.error;let u2=await sb.from('foods').update({sort_order:cv}).eq('id',other.id);if(u2.error)throw u2.error;await loadFoods(categoryId)}catch(e){alert('جابجایی غذا انجام نشد: '+e.message)}}async function loadFoods(categoryId){let q=sb.from('foods').select('id,name,price,image_url,description,category_id,stock_status,active,daily,sort_order,categories(name)').order('sort_order',{ascending:true}).order('id',{ascending:true});if(categoryId)q=q.eq('category_id',categoryId);let r=await q;if(r.error){foodList.innerHTML='<p>'+esc(r.error.message)+'</p>';return}let data=r.data||[];foodList.innerHTML=data.map((f,i)=>`<div class="item row">${f.image_url?`<img class="thumb" src="${esc(f.image_url)}" onerror="imgFallback(this)">`:'<div class="imgFallback thumb">📷 بدون عکس</div>'}<div style="flex:1"><b>${esc(f.name)}</b> — ${Number(f.price).toLocaleString('fa-AF')} افغانی<div class="muted">دسته: ${esc(f.categories?.name||'بدون دسته')} | ${esc(f.stock_status)} ${f.daily?'| غذای روز':''} | جایگاه: ${i+1}</div></div><button class="btn" title="یک پله بالا" onclick="moveFood(${f.id},'up',${f.category_id})">▲</button><button class="btn" title="یک پله پایین" onclick="moveFood(${f.id},'down',${f.category_id})">▼</button><button class="btn gold" onclick="openEdit(${f.id})">✏️ ویرایش</button><button class="btn ${f.active?'danger':'ok'}" onclick="toggleFood(${f.id},${f.active})">${f.active?'خاموش':'فعال'}</button><button class="btn danger" onclick="delFood(${f.id})">حذف</button></div>`).join('')||'<p class="muted">در این دسته غذایی نیست.</p>'}
async function isPizzaCategory(cid){let r=await sb.from('categories').select('name').eq('id',cid).single();return r.data&&r.data.name&&r.data.name.includes('پیتزا')}async function loadSizes(id){let r=await sb.from('pizza_sizes').select('*').eq('food_id',id);if(r.error)return;let a=r.data||[];for(const x of a){let el=x.size_key==='single'?$('s1_'+id):x.size_key==='double'?$('s2_'+id):x.size_key==='family'?$('sf_'+id):null;if(el)el.value=x.price??''}}async function togglePizzaEdit(id){let e=$('pizza_'+id);e.classList.toggle('hide');if(!e.classList.contains('hide'))await loadSizes(id)}async function savePizza(id){try{let name=$('pn_'+id).value.trim(),price=Number($('pp_'+id).value||0),description=$('pd_'+id).value.trim()||null;if(!name)return;let image_url=null;if($('pf_'+id).files[0])image_url=await upload($('pf_'+id).files[0]);let d={name,price,description};if(image_url)d.image_url=image_url;let u=await sb.from('foods').update(d).eq('id',id);if(u.error)throw u.error;let sizes=[['single',$('s1_'+id).value],['double',$('s2_'+id).value],['family',$('sf_'+id).value]];for(const [size_key,val] of sizes){let old=await sb.from('pizza_sizes').select('id').eq('food_id',id).eq('size_key',size_key).maybeSingle();if(old.error)throw old.error;if(val!==''&&Number(val)>=0){let r=old.data?await sb.from('pizza_sizes').update({price:Number(val)}).eq('id',old.data.id):await sb.from('pizza_sizes').insert({food_id:id,size_key,price:Number(val)});if(r.error)throw r.error}else if(old.data){let r=await sb.from('pizza_sizes').delete().eq('id',old.data.id);if(r.error)throw r.error}}m('pm_'+id,'✅ پیتزا، توضیحات و قیمت‌های اندازه‌ها ذخیره شد.','#197a4b');await loadFoods(fc.value)}catch(e){m('pm_'+id,'❌ '+e.message,'#b52b2b')}}sb.auth.getSession().then(r=>{if(r.data.session)boot()})</script></body></html>
