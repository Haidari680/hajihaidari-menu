name: Activate category click
on:
  push:
    paths:
      - '.github/workflows/activate-category.yml'
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate category selector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          fn = '''<script>\n(function(){\n  window.selectCategory = function(category){\n    window.dispatchEvent(new CustomEvent('hh:category-change',{detail:{category:category}}));\n    if (typeof window.renderMenu === 'function') window.renderMenu(category);\n  };\n})();\n</script>'''
          if 'window.selectCategory = function' not in s:
              s = s.replace('</body>', fn+'\n</body>', 1) if '</body>' in s else s+'\n'+fn+'\n'
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit activation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Activate category click'
          git push
