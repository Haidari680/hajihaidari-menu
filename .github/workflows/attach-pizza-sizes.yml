name: Attach pizza sizes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  attach:
    if: ${{ github.event.head_commit.message != 'Load pizza size module' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach pizza module
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','admin.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              tag='<script src="./pizza-sizes.js"></script>'
              if tag not in s:
                  marker='</body>'
                  if marker in s:
                      s=s.replace(marker,tag+marker,1)
                      p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html admin.html
          git diff --cached --quiet || (git commit -m 'Load pizza size module' && git push)
