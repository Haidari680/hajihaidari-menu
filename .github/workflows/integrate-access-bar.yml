name: Integrate access bar admin
on:
  push:
    paths:
      - 'scripts/add_access_bar.py'
      - '.github/workflows/integrate-access-bar.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch admin panel
        run: python scripts/add_access_bar.py
      - name: Commit admin changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add access bar management to admin panel'
          git push
