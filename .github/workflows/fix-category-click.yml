name: Fix category click
on:
  push:
    paths:
      - '.github/workflows/fix-category-click.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add category selector to index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          fn = r'''<script>
          (function(){
            window.selectCategory = function(category){
              window.dispatchEvent(new CustomEvent('hh:category-change',{detail:{category:category}}));
              if (typeof window.renderMenu === 'function') window.renderMenu(category);
            };
          })();
          </script>'''
          if 'window.selectCategory = function' not in s:
              marker='</body>'
              if marker in s:
                  s=s.replace(marker, fn+'\n'+marker, 1)
              else:
                  s += '\n'+fn+'\n'
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix category click in index.html'
          git push
