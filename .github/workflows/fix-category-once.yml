name: One-time category fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'function selectCategory(category)' in s:
              print('selectCategory already exists; nothing to do.')
              raise SystemExit(0)
          marker = '\n</script>\n</body>\n</html>'
          fn = r'''
function selectCategory(category){
    activeCategory = category;
    renderCategories();
    renderMenu();
    const menu = document.getElementById("menu");
    if(menu) menu.scrollIntoView({behavior:"smooth",block:"start"});
}
'''
          if marker not in s:
              raise SystemExit('Could not find final script marker')
          s = s.replace(marker, '\n' + fn + marker, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix category click filtering in index'
          git push
