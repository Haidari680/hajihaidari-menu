name: Fix menu performance and category editing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch menu and admin
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # ---------- Admin: make category names directly editable ----------
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          old = '''<div class="item row"><div class="catEdit"><input id="cat_${c.id}" value="${esc(c.name)}" aria-label="نام دسته ${esc(c.name)}" disabled></div><button class="btn gold" onclick="editCat(${c.id})">ویرایش</button><button class="btn ${c.active?'danger':'ok'}" onclick="toggleCat(${c.id},${c.active})">${c.active?'خاموش':'فعال'}</button><button class="btn danger" onclick="delCat(${c.id})">حذف</button></div>'''
          new = '''<div class="item row"><div class="catEdit"><input id="cat_${c.id}" value="${esc(c.name)}" aria-label="نام دسته ${esc(c.name)}" onkeydown="if(event.key==='Enter')saveCat(${c.id})"></div><button class="btn gold" onclick="saveCat(${c.id})">💾 ذخیره نام</button><button class="btn ${c.active?'danger':'ok'}" onclick="toggleCat(${c.id},${c.active})">${c.active?'خاموش':'فعال'}</button><button class="btn danger" onclick="delCat(${c.id})">حذف</button></div>'''
          if old not in s:
              raise SystemExit('admin category block not found')
          s = s.replace(old, new, 1)
          s = re.sub(r'function editCat\(id\)\{.*?\}\s*async function saveCat', 'async function saveCat', s, count=1)
          p.write_text(s, encoding='utf-8')

          # ---------- Menu: defer food images + transform Supabase Storage images ----------
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'function optimizeImageUrl' not in s:
              helper = '''<script>function optimizeImageUrl(url,width=700){try{if(!url)return url;const u=new URL(url);if(u.hostname.endsWith('.supabase.co')&&u.pathname.includes('/storage/v1/object/public/')){u.pathname=u.pathname.replace('/storage/v1/object/public/','/storage/v1/render/image/public/');u.searchParams.set('width',String(width));u.searchParams.set('quality','72');u.searchParams.set('resize','contain');return u.toString()}return url}catch(e){return url}}</script>'''
              s = s.replace('</body>', helper + '</body>', 1)

          s = s.replace('<img src="${esc(f.image_url)}">', '<img loading="lazy" decoding="async" fetchpriority="low" src="${esc(optimizeImageUrl(f.image_url,700))}">')
          s = s.replace('<img src="${esc(s.image_url)}">', '<img loading="lazy" decoding="async" fetchpriority="low" src="${esc(optimizeImageUrl(s.image_url,1100))}">')
          # Reduce mobile paint cost without changing the design.
          s = s.replace('</style>', '.card{content-visibility:auto;contain-intrinsic-size:360px 430px}.photo img{content-visibility:auto}</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html admin.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix category editing and speed up menu images"
            git push
          fi
