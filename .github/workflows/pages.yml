name: Deploy static menu to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify required files
        run: test -f admin.html && test -f site-settings.js && test -f admin-settings.js && test -f menu-enhancements.js && test -f admin-visual-settings.js && test -f admin-location-settings.js && test -f location-display.js

      - name: Add menu and admin scripts
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          for tag, file_name in [
              ('<script src="reviews.js"></script>', 'reviews.js'),
              ('<script src="./supabase-menu.js"></script>', 'supabase-menu.js'),
              ('<script src="./site-settings.js"></script>', 'site-settings.js'),
              ('<script src="./menu-enhancements.js"></script>', 'menu-enhancements.js'),
              ('<script src="./location-display.js"></script>', 'location-display.js'),
          ]:
              if tag not in s and Path(file_name).exists():
                  s = s.replace('</body>', tag + '\n</body>', 1)
          css_tag = '<link rel="stylesheet" href="logo-enhancement.css">'
          if css_tag not in s and Path('logo-enhancement.css').exists():
              s = s.replace('</head>', css_tag + '\n</head>', 1)
          admin_link = '''<a href="admin.html" aria-label="ورود به پنل مدیریت" style="position:fixed;left:14px;top:14px;z-index:9999;background:#07172f;color:#fff;border:1px solid #d8b45a;border-radius:12px;padding:9px 13px;text-decoration:none;font:800 13px Tahoma,Arial,sans-serif;box-shadow:0 8px 22px #0003">⚙️ مدیریت</a>'''
          if 'aria-label="ورود به پنل مدیریت"' not in s:
              s = s.replace('</body>', admin_link + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          for tag, file_name in [
              ('<script src="./admin-categories.js?v=1"></script>', 'admin-categories.js'),
              ('<script src="./admin-settings.js"></script>', 'admin-settings.js'),
              ('<script src="./admin-visual-settings.js"></script>', 'admin-visual-settings.js'),
              ('<script src="./admin-location-settings.js"></script>', 'admin-location-settings.js'),
          ]:
              if tag not in s and Path(file_name).exists():
                  s = s.replace('</body>', tag + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
