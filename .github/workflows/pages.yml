name: Deploy static menu to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Verify required files
        run: test -f admin.html && test -f auth-guard.js && test -f site-settings.js && test -f admin-settings.js && test -f menu-enhancements.js && test -f admin-visual-settings.js && test -f admin-location-settings.js && test -f location-display.js && test -f pizza-sizes.js && test -f pizza-admin-fix.js && test -f api-key-fix.js && test -f pizza-customer-bridge.js
      - name: Prepare deployment
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          def ensure_script(s, filename, version):
              pattern=rf'<script src="\./{re.escape(filename)}(?:\?v=[^"]+)?"></script>'
              tag=f'<script src="./{filename}?v={version}"></script>'
              if re.search(pattern,s): return re.sub(pattern,tag,s,count=1)
              return s.replace('</body>',tag+'\n</body>',1)
          for filename,version in [
            ('reviews.js',''),
            ('supabase-menu.js',''),
            ('site-settings.js',''),
            ('menu-enhancements.js','2'),
            ('location-display.js',''),
            ('pizza-sizes.js','20260904-4'),
            ('pizza-customer-bridge.js','20260904-4')]:
              if version:
                s=ensure_script(s,filename,version)
              else:
                tag=f'<script src="./{filename}"></script>'
                if tag not in s and Path(filename).exists(): s=s.replace('</body>',tag+'\n</body>',1)
          css='<link rel="stylesheet" href="logo-enhancement.css">'
          if css not in s and Path('logo-enhancement.css').exists(): s=s.replace('</head>',css+'\n</head>',1)
          pattern=r'<div class="service service-pick"><img src="data:image/webp;base64,[A-Za-z0-9+/=]+"[^>]*></div>'
          s=re.sub(pattern,'<div class="service service-pick"><b>⚡ سفارش سریع</b><span>ساده و سریع</span></div>',s,count=1)
          p.write_text(s,encoding='utf-8')
          p=Path('admin.html'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script src="pizza-admin-fix\.js(?:\?v=[^"]+)?"></script>','<script src="pizza-admin-fix.js?v=20260902-2"></script>',s)
          cdn='<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          fix='<script src="api-key-fix.js?v=20260904-2"></script>'
          if fix not in s and cdn in s: s=s.replace(cdn,cdn+'\n'+fix,1)
          tag='<script src="./pizza-sizes.js?v=20260904-4"></script>'
          s=re.sub(r'<script src="\./pizza-sizes\.js(?:\?v=[^"]+)?"></script>',tag,s)
          if tag not in s and Path('pizza-sizes.js').exists(): s=s.replace('</body>',tag+'\n</body>',1)
          for tag,file_name in [
            ('<script src="./admin-categories.js?v=2"></script>','admin-categories.js'),
            ('<script src="./admin-settings.js"></script>','admin-settings.js'),
            ('<script src="./admin-visual-settings.js"></script>','admin-visual-settings.js'),
            ('<script src="./admin-location-settings.js"></script>','admin-location-settings.js'),
            ('<script src="./image-optimizer.js"></script>','image-optimizer.js'),
            ('<script src="./auth-guard.js"></script>','auth-guard.js')]:
            if tag not in s and Path(file_name).exists(): s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify deployment contents
        run: |
          grep -q "moveFood" admin.html
          grep -q "ویرایش" admin.html
          grep -q "pizza-admin-fix.js?v=20260902-2" admin.html
          grep -q "api-key-fix.js?v=20260904-2" admin.html
          grep -q "one_price" pizza-admin-fix.js
          grep -q "two_price" pizza-admin-fix.js
          grep -q "family_price" pizza-admin-fix.js
          grep -q "pizza-sizes.js?v=20260904-4" index.html
          grep -q "pizza-customer-bridge.js?v=20260904-4" index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
