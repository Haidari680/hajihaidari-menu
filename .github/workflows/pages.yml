name: Deploy static menu to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify admin panel exists
        run: test -f admin.html

      - name: Add admin panel, reviews and Supabase menu connection
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          review_tag = '<script src="reviews.js"></script>'
          if review_tag not in s and Path('reviews.js').exists():
              s = s.replace('</body>', review_tag + '\n</body>', 1)

          supabase_tag = '<script src="./supabase-menu.js"></script>'
          if supabase_tag not in s and Path('supabase-menu.js').exists():
              s = s.replace('</body>', supabase_tag + '\n</body>', 1)

          admin_link = '''<a href="admin.html" aria-label="ورود به پنل مدیریت" style="position:fixed;left:14px;top:14px;z-index:9999;background:#07172f;color:#fff;border:1px solid #d8b45a;border-radius:12px;padding:9px 13px;text-decoration:none;font:800 13px Tahoma,Arial,sans-serif;box-shadow:0 8px 22px #0003">⚙️ مدیریت</a>'''
          if 'aria-label="ورود به پنل مدیریت"' not in s:
              s = s.replace('</body>', admin_link + '\n</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Deployment trigger for the latest admin panel upload support.
