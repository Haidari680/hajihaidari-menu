name: Finalize food category management
on:
  push:
    paths:
      - '.github/workflows/finalize-food-category-management.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add category management to admin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'HH_FINAL_FOOD_CATEGORY_MANAGEMENT' in s:
              raise SystemExit(0)
          js = r'''<script id="HH_FINAL_FOOD_CATEGORY_MANAGEMENT">
          (function(){
            'use strict';
            const KEY='hh_menu_data_v1';
            const DEFAULT_CATS=['کباب','پیتزا','غذاهای ایرانی','فست فود','آبمیوه','نوشیدنی','دسر','سینی ها','مخصوص ها','ساده ها'];
            const css=`
            <style id="hh-cat-admin-style">
              #hhCatAdminBtn{margin:8px 0;display:none;width:100%;border:0;border-radius:10px;padding:10px 14px;background:#f0ad12;color:#071b40;font-family:inherit;font-weight:700;cursor:pointer}
              #hhCatOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30000;align-items:center;justify-content:center;padding:14px}
              #hhCatOverlay.open{display:flex}.hhCatBox{width:min(760px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:18px;padding:18px;direction:rtl;line-height:1.7;box-shadow:0 20px 60px rgba(0,0,0,.35)}
              .hhCatHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.hhCatHead h2{margin:0;color:#082453}
              .hhCatClose{border:0;border-radius:50%;width:34px;height:34px;cursor:pointer;background:#eee}.hhCatRow{display:grid;grid-template-columns:1fr 210px auto;gap:8px;align-items:center;border-bottom:1px solid #eee;padding:10px 0}.hhCatName{font-weight:700;color:#17345f}.hhCatSelect{width:100%;padding:9px;border:1px solid #d8dce5;border-radius:10px;font-family:inherit}.hhCatSave{border:0;border-radius:10px;padding:9px 12px;background:#082453;color:#fff;font-family:inherit;font-weight:700;cursor:pointer}.hhCatMsg{margin-top:10px;padding:10px;border-radius:10px;background:#eef7ee;color:#206020;display:none}.hhCatEmpty{padding:16px;text-align:center;color:#666}
              @media(max-width:640px){.hhCatRow{grid-template-columns:1fr}.hhCatSave{width:100%}}
            </style>`;
            function parseState(){
              const candidates=[KEY];
              for(let i=0;i<localStorage.length;i++) candidates.push(localStorage.key(i));
              for(const k of candidates){
                if(!k) continue;
                try{const v=JSON.parse(localStorage.getItem(k)||'null'); if(v && Array.isArray(v.foods)) return {key:k,state:v};}catch(e){}
              }
              return {key:KEY,state:{foods:[],categories:DEFAULT_CATS.slice(),cart:[],waiter:false}};
            }
            function getCats(state){
              const list=(Array.isArray(state.categories)?state.categories:[]).map(x=>String(x).trim()).filter(Boolean);
              const all=list.length?list:DEFAULT_CATS.slice();
              for(const c of DEFAULT_CATS) if(!all.includes(c)) all.push(c);
              return all;
            }
            function persist(key,state){localStorage.setItem(key,JSON.stringify(state));}
            function refresh(){
              try{window.dispatchEvent(new CustomEvent('hh:category-management-updated'));}catch(e){}
              const names=['renderMenu','renderAdmin','renderAll','render','loadData','loadMenu'];
              for(const n of names){if(typeof window[n]==='function'){try{window[n]();}catch(e){}}}
            }
            function findAdminRoot(){
              const qs=['#adminPanel','#admin','#managementPanel','.admin-panel','.adminPanel','.management-panel','[id*="admin" i]','[class*="admin" i]'];
              for(const q of qs){const el=document.querySelector(q);if(el)return el;}
              const all=[...document.querySelectorAll('div,section,aside,main')];
              return all.find(el=>{const t=(el.textContent||'').trim();return t.includes('مدیریت منو') && t.length<5000;})||null;
            }
            function ensureButton(){
              const root=findAdminRoot();
              if(!root)return false;
              let btn=document.getElementById('hhCatAdminBtn');
              if(!btn){
                btn=document.createElement('button');btn.id='hhCatAdminBtn';btn.type='button';btn.textContent='📂 مدیریت دسته‌بندی غذاها';
                btn.onclick=openPanel;
                root.appendChild(btn);
              }
              const visible=!!(root.offsetWidth||root.offsetHeight||root.getClientRects().length);
              btn.style.display=visible?'block':'none';
              return true;
            }
            function makePanel(){
              if(document.getElementById('hhCatOverlay'))return;
              document.head.insertAdjacentHTML('beforeend',css);
              const o=document.createElement('div');o.id='hhCatOverlay';
              o.innerHTML=`<div class="hhCatBox"><div class="hhCatHead"><h2>📂 مدیریت دسته‌بندی غذاها</h2><button class="hhCatClose" type="button">×</button></div><div id="hhCatRows"></div><div id="hhCatMsg" class="hhCatMsg"></div></div>`;
              document.body.appendChild(o);
              o.querySelector('.hhCatClose').onclick=()=>o.classList.remove('open');
              o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');});
            }
            function openPanel(){makePanel();renderRows();document.getElementById('hhCatOverlay').classList.add('open');}
            function renderRows(){
              const box=document.getElementById('hhCatRows'); if(!box)return;
              const {state}=parseState(); const cats=getCats(state); const foods=Array.isArray(state.foods)?state.foods:[];
              if(!foods.length){box.innerHTML='<div class="hhCatEmpty">هنوز غذایی در منو ثبت نشده است.</div>';return;}
              box.innerHTML='';
              foods.forEach((food,index)=>{
                const row=document.createElement('div');row.className='hhCatRow';
                const name=document.createElement('div');name.className='hhCatName';name.textContent=String(food.name||food.title||('غذا '+(index+1)));
                const sel=document.createElement('select');sel.className='hhCatSelect';
                cats.forEach(c=>{const op=document.createElement('option');op.value=c;op.textContent=c;sel.appendChild(op);});
                const current=String(food.category||food.cat||food.section||'').trim();
                if(current && !cats.includes(current)){const op=document.createElement('option');op.value=current;op.textContent=current;sel.appendChild(op);}
                sel.value=current||cats[0];
                const save=document.createElement('button');save.className='hhCatSave';save.type='button';save.textContent='ذخیره';
                save.onclick=function(){
                  const latest=parseState(); const f=Array.isArray(latest.state.foods)?latest.state.foods[index]:null; if(!f)return;
                  const cat=sel.value||cats[0]; f.category=cat; if(Object.prototype.hasOwnProperty.call(f,'cat'))f.cat=cat; if(Object.prototype.hasOwnProperty.call(f,'section'))f.section=cat;
                  persist(latest.key,latest.state); const msg=document.getElementById('hhCatMsg'); msg.textContent='دستهٔ «'+(f.name||f.title||'غذا')+'» به «'+cat+'» تغییر کرد.'; msg.style.display='block'; setTimeout(()=>msg.style.display='none',1800); refresh();
                };
                row.append(name,sel,save);box.appendChild(row);
              });
            }
            function init(){makePanel();ensureButton();}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
            const mo=new MutationObserver(()=>ensureButton()); mo.observe(document.documentElement,{childList:true,subtree:true});
            setInterval(ensureButton,1200);
          })();
          </script>`;
          marker='</body>'
          if marker in s:
              s=s.replace(marker,js+'\n'+marker,1)
          else:
              s+=js
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit final category management
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/finalize-food-category-management.yml
          git diff --cached --quiet || git commit -m 'Finalize food category selection and reassignment'
          git push
