name: Inject pizza admin fix
on:
  push:
    branches: [main]
    paths:
      - 'pizza-admin-fix.js'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject script tag
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="pizza-admin-fix.js"></script>'
          if tag not in s:
              if '</body>' in s:
                  s=s.replace('</body>',tag+'</body>')
              else:
                  s += tag
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit admin fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git diff --cached --quiet || git commit -m 'Load robust pizza editor in admin'
          git push
