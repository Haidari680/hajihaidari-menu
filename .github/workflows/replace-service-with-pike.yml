name: Replace first service with pike image

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  replace:
    if: ${{ !contains(github.event.head_commit.message, 'Replace first service with pike image') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace first service
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          old = '<div class="service"><b>⚡ سفارش سریع</b><span>ساده و سریع</span></div>'
          b64 = Path('_pike_card_clean.b64').read_text(encoding='utf-8').strip()
          new = '<div class="service service-pick"><img src="data:image/webp;base64,' + b64 + '" alt="پیک رایگان"></div>'
          if old in html and 'service-pick' not in html:
              html = html.replace(old, new, 1)
              css = '.service-pick{padding:0!important;overflow:hidden;display:flex;align-items:center;justify-content:center}.service-pick img{display:block;width:100%;height:100%;min-height:100px;object-fit:cover;border-radius:12px}'
              html = html.replace('</style>', css + '</style>', 1)
              p.write_text(html, encoding='utf-8')
          else:
              print('No replacement needed')
          PY
      - name: Clean temporary files and commit
        shell: bash
        run: |
          rm -f _pike_card_clean.b64 .github/workflows/replace-service-with-pike.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Replace first service with pike image'
          git push
