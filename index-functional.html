<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;font-family:Tahoma,Arial,sans-serif}
#page{position:relative;width:100%;max-width:1024px;margin:0 auto;line-height:0}#page>img{display:block;width:100%;height:auto}
.hot{position:absolute;border:0;background:transparent;cursor:pointer;padding:0}.hot:focus{outline:2px solid #f5b51b;outline-offset:2px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#061b43;color:#fff;border:2px solid #eeb01b;border-radius:14px;padding:12px 20px;z-index:9999;opacity:0;pointer-events:none;transition:.25s;font-weight:bold;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:10000;align-items:center;justify-content:center;padding:18px}
#modal.open{display:flex}.box{width:min(520px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:20px;padding:18px;direction:rtl;line-height:1.7;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.box h2{margin:0 0 12px;color:#082453}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding:10px 0}
.btn{border:0;border-radius:10px;padding:9px 13px;background:#f0ad12;color:#071b40;font-family:inherit;font-weight:bold;cursor:pointer}.btn.blue{background:#082453;color:#fff}.btn.red{background:#c62828;color:#fff}
input,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;font-family:inherit;margin:4px 0 8px}.close{float:left;background:#eee;border:0;border-radius:50%;width:32px;height:32px;cursor:pointer}
</style>

<script>
const KEY='hh_menu_v2';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{cart:[],foods:[],waiter:false,daily:[]};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function openModal(h){document.getElementById('box').innerHTML=h;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function addCart(n,p){const f=state.foods.find(x=>x.name===n);if(f&&f.available===false){toast('🔴 این غذا فعلاً تمام شده است');return}const x=state.cart.find(x=>x.name===n);if(x)x.qty++;else state.cart.push({name:n,price:p,qty:1});save();toast('🛒 '+n+' به سبد خرید اضافه شد')}
function showCart(){let total=0;let rows=state.cart.map(x=>{total+=x.price*x.qty;return `<div class="row"><span>${x.name} × ${x.qty}</span><b>${(x.price*x.qty).toLocaleString()} افغانی</b></div>`}).join('');if(!rows)rows='<p>سبد خرید خالی است.</p>';openModal(`<button class="close" onclick="closeModal()">×</button><h2>🛒 سبد خرید</h2>${rows}<hr><b>مجموع: ${total.toLocaleString()} افغانی</b><br><br><button class="btn red" onclick="state.cart=[];save();closeModal();toast('سبد خرید پاک شد')">پاک کردن سبد</button>`)}
function waiter(){state.waiter=true;save();toast('🔔 فراخوان گارسون ارسال شد')}
function category(c){openModal(`<button class="close" onclick="closeModal()">×</button><h2>🍽️ ${c}</h2><p>این دسته انتخاب شد. غذاهای این بخش را می‌توان از مدیریت منو تنظیم کرد.</p><button class="btn blue" onclick="closeModal()">بستن</button>`)}
function admin(){renderAdmin()}
function renderAdmin(){let rows=state.foods.map((f,i)=>`<div class="row"><span><b>${esc(f.name)}</b><br><small>${Number(f.price||0).toLocaleString()} افغانی</small></span><span><button class="btn" onclick="toggleFood(${i})">${f.available===false?'🔴 تمام شد':'🟢 موجود'}</button> <button class="btn" onclick="toggleDaily(${i})">${f.daily?'⭐ غذای روز':'☆ غذای روز'}</button> <button class="btn red" onclick="delFood(${i})">حذف</button></span></div>`).join('');if(!rows)rows='<p>هنوز غذایی در مدیریت ثبت نشده است.</p>';openModal(`<button class="close" onclick="closeModal()">×</button><h2>⚙️ مدیریت منو</h2><input id="fn" placeholder="نام غذا"><input id="fp" inputmode="numeric" placeholder="قیمت (افغانی)"><button class="btn blue" onclick="addFood()">➕ افزودن غذا</button><hr>${rows}<br><button class="btn" onclick="showReviews()">⭐ نظر مشتریان</button>`)}
function addFood(){const n=document.getElementById('fn').value.trim(),p=Number(document.getElementById('fp').value||0);if(!n)return toast('نام غذا را وارد کنید');state.foods.push({name:n,price:p,available:true,daily:false});save();renderAdmin();toast('غذا اضافه شد')}
function toggleFood(i){state.foods[i].available=state.foods[i].available===false;save();renderAdmin()}
function toggleDaily(i){state.foods[i].daily=!state.foods[i].daily;save();renderAdmin()}
function delFood(i){if(confirm('این غذا حذف شود؟')){state.foods.splice(i,1);save();renderAdmin()}}
function showReviews(){openModal(`<button class="close" onclick="closeModal()">×</button><h2>⭐ نظر مشتریان</h2><input id="rn" placeholder="نام (اختیاری)"><textarea id="rt" rows="4" placeholder="نظر، انتقاد یا پیشنهاد شما"></textarea><button class="btn blue" onclick="toast('نظر ثبت شد');closeModal()">ثبت نظر</button>`)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script>
</body></html>
