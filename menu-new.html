<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مجموعه حاجی حیدری | منوی دیجیتال</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Tahoma,Arial,sans-serif;
 background:#f4f8fc;
 color:#172b3a;
}
header{
 background:linear-gradient(135deg,#0757a8,#0b78d0);
 color:white;
 padding:24px 15px;
 text-align:center;
 border-radius:0 0 28px 28px;
 box-shadow:0 5px 20px #0002;
}
.logo{
 width:92px;height:92px;
 border-radius:50%;
 object-fit:cover;
 background:white;
 display:block;
 margin:auto;
}
header h1{margin:10px 0 4px;font-size:27px}
header p{margin:0;opacity:.9}

.top-buttons{
 display:flex;
 justify-content:center;
 gap:9px;
 flex-wrap:wrap;
 padding:15px;
}
.top-buttons button{
 background:white;
 color:#0757a8;
 border:0;
 padding:11px 15px;
 border-radius:12px;
 box-shadow:0 3px 12px #0001;
 font-family:inherit;
 cursor:pointer;
}

.categories{
 display:flex;
 gap:8px;
 overflow-x:auto;
 padding:0 15px 15px;
}
.categories button{
 white-space:nowrap;
 background:white;
 color:#0757a8;
 border:1px solid #d7e5f2;
 border-radius:20px;
 padding:9px 15px;
 font-family:inherit;
 cursor:pointer;
}
.categories button.active{
 background:#0757a8;
 color:white;
}

.container{
 max-width:950px;
 margin:auto;
 padding:0 15px 110px;
}

.title-row{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin:12px 0;
}
.title-row h2{
 margin:0;
 font-size:21px;
}

.menu-grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
 gap:15px;
}

.food-card{
 background:white;
 border-radius:19px;
 padding:12px;
 box-shadow:0 4px 17px #00000012;
}
.food-image{
 width:100%;
 height:170px;
 object-fit:cover;
 border-radius:15px;
 background:#e7eef5;
}
.food-name{
 font-weight:bold;
 font-size:18px;
 margin-top:10px;
}
.food-desc{
 color:#6b7885;
 font-size:13px;
 margin:5px 0;
 min-height:18px;
}
.food-bottom{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-top:9px;
}
.price{
 color:#0757a8;
 font-size:18px;
 font-weight:bold;
}
.status{
 border-radius:20px;
 padding:5px 9px;
 font-size:12px;
}
.available{
 background:#e8f8ee;
 color:#16803a;
}
.finished{
 background:#fdeaea;
 color:#c62828;
}
.add-btn{
 width:100%;
 margin-top:10px;
 background:#0757a8;
 color:white;
 border:0;
 padding:11px;
 border-radius:11px;
 font-family:inherit;
 cursor:pointer;
}
.add-btn:disabled{
 background:#aaa;
 cursor:not-allowed;
}

.bottom-bar{
 position:fixed;
 bottom:15px;
 left:15px;
 right:15px;
 max-width:520px;
 margin:auto;
 display:flex;
 gap:9px;
 z-index:20;
}
.bottom-bar button{
 flex:1;
 padding:13px;
 border:0;
 border-radius:14px;
 font-family:inherit;
 cursor:pointer;
 box-shadow:0 5px 18px #0003;
}
.cart-button{
 background:#0757a8;
 color:white;
}
.waiter-button{
 background:white;
 color:#0757a8;
}

.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#0008;
 z-index:100;
 padding:18px;
 overflow:auto;
}
.modal-box{
 background:white;
 max-width:600px;
 margin:25px auto;
 border-radius:20px;
 padding:20px;
}
.close{
 float:left;
 border:0;
 background:#eee;
 border-radius:8px;
 padding:7px 10px;
 cursor:pointer;
}
.modal h2{margin-top:5px}

input,textarea,select{
 width:100%;
 padding:11px;
 margin:5px 0 10px;
 border:1px solid #ccd9e5;
 border-radius:10px;
 font-family:inherit;
}
.primary{
 background:#0757a8;
 color:white;
 border:0;
 padding:11px 15px;
 border-radius:10px;
 cursor:pointer;
 font-family:inherit;
}
.cart-line{
 display:flex;
 justify-content:space-between;
 gap:10px;
 align-items:center;
 padding:11px 0;
 border-bottom:1px solid #eee;
}
.total{
 margin-top:15px;
 font-weight:bold;
 font-size:20px;
 color:#0757a8;
}
.admin-line{
 padding:11px 0;
 border-bottom:1px solid #eee;
}
.admin-line button{
 margin:4px 2px;
 padding:7px 10px;
 border:0;
 border-radius:8px;
 cursor:pointer;
 font-family:inherit;
}
.review{
 background:white;
 border-radius:15px;
 padding:15px;
 margin-top:12px;
 box-shadow:0 3px 12px #0001;
}
.stars{
 color:#f4b400;
 font-size:22px;
 cursor:pointer;
}
footer{
 text-align:center;
 color:#687784;
 font-size:13px;
 padding:25px 10px;
}

.daily-badge{
 display:inline-block;
 margin:7px 0 8px;
 padding:5px 10px;
 border-radius:20px;
 background:#fff4d6;
 color:#b57900;
 font-size:13px;
 font-weight:900;
}
</style>
</head>

<body>

<header>
 <img class="logo" src="" alt="مجموعه حاجی حیدری">
 <h1>مجموعه حاجی حیدری</h1>
 <p>منوی دیجیتال</p>
</header>

<div class="top-buttons">
 <button onclick="openAdmin()">⚙️ مدیریت</button>
 <button onclick="openReviews()">⭐ نظر مشتریان</button>
</div>

<div class="categories" id="categories"></div>

<main class="container">

 <div class="title-row">
  <h2 id="categoryTitle">همه غذاها</h2>
  <span id="foodCount"></span>
 </div>

 <div class="menu-grid" id="menu"></div>

 <section id="reviewsSection" style="display:none;margin-top:30px">
  <h2>⭐ نظر و امتیاز مشتریان</h2>

  <div class="review">
   <input id="reviewName" placeholder="نام شما (اختیاری)">

   <div class="stars" id="stars">
    <span onclick="setRating(1)">★</span>
    <span onclick="setRating(2)">★</span>
    <span onclick="setRating(3)">★</span>
    <span onclick="setRating(4)">★</span>
    <span onclick="setRating(5)">★</span>
   </div>

   <textarea id="reviewText" rows="4"
    placeholder="نظر، انتقاد یا پیشنهاد شما"></textarea>

   <button class="primary" onclick="submitReview()">ثبت نظر</button>
  </div>

  <div id="reviewsList"></div>
 </section>

</main>

<div class="bottom-bar">
 <button class="cart-button" onclick="openCart()">
  🛒 سبد خرید <span id="cartCount">0</span>
 </button>

 <button class="waiter-button" onclick="callWaiter()">
  🔔 فراخوان گارسون
 </button>
</div>

<footer>
 مجموعه حاجی حیدری © ۱۴۰۵
</footer>

<!-- سبد خرید -->
<div class="modal" id="cartModal">
 <div class="modal-box">
  <button class="close" onclick="closeModal('cartModal')">✕</button>
  <h2>🛒 سبد خرید</h2>

  <div id="cartList"></div>

  <div class="total" id="cartTotal"></div>

  <button class="primary"
   style="width:100%;margin-top:15px"
   onclick="submitOrder()">
   ثبت سفارش
  </button>
 </div>
</div>

<!-- مدیریت -->
<div class="modal" id="adminModal">
 <div class="modal-box">
  <button class="close" onclick="closeModal('adminModal')">✕</button>

  <h2>⚙️ مدیریت منو</h2>

  <input id="foodName" placeholder="نام غذا">
  <input id="foodPrice" type="number" placeholder="قیمت">
  <input id="foodImage" placeholder="آدرس تصویر">
  <input id="foodDesc" placeholder="توضیحات">

  <select id="foodCategory">
   <option>کباب</option>
   <option>پیتزا</option>
   <option>غذا</option>
   <option>آبمیوه</option>
   <option>نوشیدنی سرد</option>
   <option>سینی ها</option>
   <option>مخصوص ها</option>
   <option>ساده ها</option>
  </select>

  <select id="foodStatus">
   <option value="available">🟢 موجود</option>
   <option value="finished">🔴 تمام شد</option>
  </select>

  <button class="primary" onclick="addFood()">
   ➕ افزودن غذا
  </button>

  <hr>

  <h3>غذاهای منو</h3>
  <div id="adminList"></div>
 </div>
</div>

<script>

const starterFoods=[
 {
  id:1,
  name:"کباب کوبیده",
  price:250,
  category:"کباب",
  image:"",
  desc:"کباب کوبیده مخصوص",
  status:"available",
  daily:false
 },
 {
  id:2,
  name:"جوجه کباب",
  price:280,
  category:"کباب",
  image:"",
  desc:"جوجه کباب زعفرانی",
  status:"available",
  daily:false
 },
 {
  id:3,
  name:"پیتزا مخصوص",
  price:350,
  category:"پیتزا",
  image:"",
  desc:"پیتزای مخصوص مجموعه",
  status:"available",
  daily:false
 },
 {
  id:4,
  name:"غذای مخصوص",
  price:300,
  category:"مخصوص ها",
  image:"",
  desc:"غذای ویژه مجموعه حاجی حیدری",
  status:"available"
 }
];

let foods=
 JSON.parse(localStorage.getItem("hajihaidari_foods"))||
 starterFoods;

foods=foods.map(f=>({
 ...f,
 daily:f.daily===true
}));

// اتصال با اطلاعات قدیمی مدیریت منو
// این بخش باعث می‌شود غذاهایی که در features.js ساخته یا «غذای روز» شده‌اند
// در منوی اصلی هم شناخته شوند.
try {
 const oldData = JSON.parse(localStorage.getItem("hh_menu_data_v1") || "null");

 if (oldData && Array.isArray(oldData.foods)) {
  oldData.foods.forEach(oldFood => {
   const existing = foods.find(f =>
    String(f.name).trim() === String(oldFood.name || "").trim()
   );

   if (existing) {
    existing.daily = oldFood.daily === true;
    if (oldFood.available === false) existing.status = "finished";
   } else {
    foods.push({
     id: oldFood.id || Date.now() + Math.random(),
     name: oldFood.name || "غذا",
     price: Number(oldFood.price || 0),
     category: oldFood.category || "غذا",
     image: oldFood.image || "",
     desc: oldFood.desc || "",
     status: oldFood.available === false ? "finished" : "available",
     daily: oldFood.daily === true
    });
   }
  });

  saveFoods();
 }
} catch (error) {
 console.log("Legacy menu data not available", error);
}

let cart=[];
let currentCategory="همه";
let rating=5;

function saveFoods(){
 localStorage.setItem(
  "hajihaidari_foods",
  JSON.stringify(foods)
 );
}

function syncLegacyMenu(){
 try{
  const oldData=JSON.parse(localStorage.getItem("hh_menu_data_v1") || "null");
  if(!oldData || !Array.isArray(oldData.foods)) return false;
  let changed=false;
  oldData.foods.forEach(oldFood=>{
   const name=String(oldFood.name || "").trim(); if(!name) return;
   const existing=foods.find(f=>String(f.name || "").trim()===name);
   if(existing){
    const daily=oldFood.daily===true; const status=oldFood.available===false ? "finished" : "available";
    if(existing.daily!==daily){existing.daily=daily; changed=true;}
    if(existing.status!==status){existing.status=status; changed=true;}
   }else{
    foods.push({id:oldFood.id || Date.now()+Math.random(),name:name,price:Number(oldFood.price || 0),category:oldFood.category || "غذا",image:oldFood.image || "",desc:oldFood.desc || "",status:oldFood.available===false ? "finished" : "available",daily:oldFood.daily===true}); changed=true;
   }
  });
  if(changed) saveFoods(); return changed;
 }catch(e){console.log("Legacy sync error",e); return false;}
}

function renderCategories(){

 const categories=[
  "همه",
  ...new Set(foods.map(f=>f.category))
 ];

 document.getElementById("categories").innerHTML=
 categories.map(c=>`
  <button
   class="${c===currentCategory?'active':''}"
   onclick="selectCategory('${c}')">
   ${c}
  </button>
 `).join("");
}

function selectCategory(category){

 currentCategory=category;

 document.getElementById("categoryTitle").textContent=
 category==="همه"?"همه غذاها":category;

 renderMenu();
 renderCategories();
}

function renderMenu(){

 syncLegacyMenu();

 let list=
 currentCategory==="همه"
 ?foods
 :foods.filter(f=>f.category===currentCategory);

 document.getElementById("foodCount").textContent=
 list.length+" مورد";

 document.getElementById("menu").innerHTML=
 list.map(food=>{

  const finished=food.status==="finished";

  return `
   <article class="food-card">

    ${
     food.image
     ?
     `<img class="food-image"
       src="${food.image}"
       alt="${food.name}">`
     :
     `<div class="food-image"></div>`
    }

    <div class="food-name">
     ${food.name}
    </div>

    ${food.daily ? `
     <div class="daily-badge">⭐ غذای روز</div>
    ` : ""}

    <div class="food-desc">
     ${food.desc||""}
    </div>

    <div class="food-bottom">

     <span class="price">
      ${Number(food.price).toLocaleString()} افغانی
     </span>

     <span class="status ${
      finished?"finished":"available"
     }">
      ${finished?"🔴 تمام شد":"🟢 موجود"}
     </span>

    </div>

    <button
     class="add-btn"
     ${finished?"disabled":""}
     onclick="addToCart(${food.id})">

     ${finished?"تمام شد":"➕ افزودن به سبد"}

    </button>

   </article>
  `;
 }).join("");
}

function addToCart(id){

 const food=foods.find(f=>f.id===id);

 if(!food || food.status==="finished") return;

 const existing=cart.find(f=>f.id===id);

 if(existing){
  existing.qty++;
 }else{
  cart.push({
   ...food,
   qty:1
  });
 }

 updateCart();
}

function updateCart(){

 document.getElementById("cartCount").textContent=
 cart.reduce((sum,item)=>sum+item.qty,0);
}

function openCart(){

 document.getElementById("cartModal").style.display="block";

 renderCart();
}

function renderCart(){

 let total=0;

 if(!cart.length){

  document.getElementById("cartList").innerHTML=
  "سبد خرید خالی است.";

 }else{

  document.getElementById("cartList").innerHTML=
  cart.map(item=>{

   total+=item.price*item.qty;

   return `
    <div class="cart-line">

     <div>
      <b>${item.name}</b><br>
      ${item.qty} ×
      ${Number(item.price).toLocaleString()}
     </div>

     <button
      onclick="removeFromCart(${item.id})">
      حذف
     </button>

    </div>
   `;

  }).join("");
 }

 document.getElementById("cartTotal").textContent=
 "مجموع: "+
 Number(total).toLocaleString()+
 " افغانی";
}

function removeFromCart(id){

 cart=cart.filter(item=>item.id!==id);

 updateCart();
 renderCart();
}

function submitOrder(){

 if(!cart.length){

  alert("سبد خرید خالی است.");
  return;
 }

 alert(
  "سفارش شما آماده ثبت است. "+
  "لطفاً برای نهایی‌کردن سفارش با گارسون هماهنگ کنید."
 );
}

function callWaiter(){

 alert("🔔 درخواست فراخوان گارسون ارسال شد.");
}

function openAdmin(){

 document.getElementById("adminModal").style.display="block";

 renderAdmin();
}

function renderAdmin(){

 document.getElementById("adminList").innerHTML=
 foods.map(food=>`

  <div class="admin-line">

   <b>${food.name}</b>
   <br>

   ${Number(food.price).toLocaleString()} افغانی
   |
   ${food.status==="available"
    ?"🟢 موجود"
    :"🔴 تمام شد"}

   <br>

   <button
    onclick="toggleStatus(${food.id})">
    تغییر وضعیت
   </button>

   <button
    onclick="toggleDaily(${food.id})">
    ${food.daily ? "⭐ غذای روز فعال" : "☆ غذای روز"}
   </button>

   <button
    onclick="deleteFood(${food.id})">
    🗑 حذف
   </button>

  </div>

 `).join("");
}

function addFood(){

 const name=
 document.getElementById("foodName").value.trim();

 const price=
 Number(document.getElementById("foodPrice").value);

 if(!name || !price){

  alert("نام و قیمت غذا را وارد کنید.");
  return;
 }

 foods.push({

  id:Date.now(),

  name:name,

  price:price,

  category:
   document.getElementById("foodCategory").value,

  image:
   document.getElementById("foodImage").value.trim(),

  desc:
   document.getElementById("foodDesc").value.trim(),

  status:
   document.getElementById("foodStatus").value,

  daily:false

 });

 saveFoods();

 renderMenu();
 renderCategories();
 renderAdmin();

 document.getElementById("foodName").value="";
 document.getElementById("foodPrice").value="";
 document.getElementById("foodImage").value="";
 document.getElementById("foodDesc").value="";

 alert("غذا با موفقیت اضافه شد.");
}

function toggleStatus(id){

 const food=foods.find(f=>f.id===id);

 if(!food)return;

 food.status=
 food.status==="available"
 ?"finished"
 :"available";

 saveFoods();

 renderMenu();
 renderAdmin();
}

function toggleDaily(id){

 const food=foods.find(f=>f.id===id);

 if(!food)return;

 food.daily=!food.daily;

 saveFoods();

 renderMenu();
 renderAdmin();
}

function deleteFood(id){

 if(!confirm("این غذا حذف شود؟"))return;

 foods=foods.filter(f=>f.id!==id);

 saveFoods();

 renderMenu();
 renderCategories();
 renderAdmin();
}

function closeModal(id){

 document.getElementById(id).style.display="none";
}

function openReviews(){

 const section=
 document.getElementById("reviewsSection");

 section.style.display="block";

 section.scrollIntoView({
  behavior:"smooth"
 });

 renderReviews();
}

function setRating(number){

 rating=number;

 document
 .querySelectorAll("#stars span")
 .forEach((star,index)=>{

  star.textContent=
  index<number?"★":"☆";

 });
}

function submitReview(){

 const name=
 document.getElementById("reviewName").value.trim()
 ||"مشتری";

 const text=
 document.getElementById("reviewText").value.trim();

 if(!text){

  alert("لطفاً نظر خود را بنویسید.");
  return;
 }

 const reviews=
 JSON.parse(
  localStorage.getItem("hajihaidari_reviews")||
  "[]"
 );

 reviews.unshift({

  name:name,

  text:text,

  rating:rating,

  date:new Date().toLocaleDateString("fa-AF")

 });

 localStorage.setItem(
  "hajihaidari_reviews",
  JSON.stringify(reviews)
 );

 document.getElementById("reviewName").value="";
 document.getElementById("reviewText").value="";

 renderReviews();

 alert("نظر شما ثبت شد.");
}

function renderReviews(){

 const reviews=
 JSON.parse(
  localStorage.getItem("hajihaidari_reviews")||
  "[]"
 );

 document.getElementById("reviewsList").innerHTML=
 reviews.map(review=>`

  <div class="review">

   <b>${review.name}</b>

   <div class="stars">
    ${"★".repeat(review.rating)}
    ${"☆".repeat(5-review.rating)}
   </div>

   <div>${review.text}</div>

   <small>${review.date}</small>

  </div>

 `).join("");
}

setRating(5);
renderCategories();
renderMenu();
updateCart();

setInterval(function(){
 const changed=syncLegacyMenu();
 if(changed){ renderCategories(); renderMenu(); }
},1000);

</script>

</body>
</html>
