<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود کارمند | حاجی حیدری</title><style>:root{--b:#07172f;--g:#e4b84f;--bg:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial;color:#17243b}.wrap{max-width:1050px;margin:auto;padding:18px}.head,.panel{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 8px 28px #07172f12}.head{background:var(--b);color:#fff}.head h1{margin:0 0 6px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field input,.field select{padding:11px;border:1px solid #d9dee6;border-radius:10px;font:inherit;width:100%}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--b);color:#fff;font-weight:800;cursor:pointer}.gold{background:var(--g);color:var(--b)}.danger{background:#b52b2b}.muted{color:#6b7280;font-size:13px}.hide{display:none}.status{min-height:24px;font-weight:700}.food{display:grid;grid-template-columns:110px 1fr;gap:14px;border:1px solid #e5e8ed;border-radius:13px;padding:12px;margin:10px 0}.food img{width:110px;height:85px;object-fit:cover;border-radius:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pizza{border-top:1px solid #e5e8ed;margin-top:12px;padding-top:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.food{grid-template-columns:1fr}.food img{width:100%;height:160px}}</style></head><body><div class="wrap"><div class="head"><h1>👤 ورود کارمند</h1><div>تغییر قیمت، عکس، غذای روز و موجودی</div></div><section id="login" class="panel"><h2>ورود با کد کارمند</h2><div class="field"><label>کد ورود</label><input id="code" type="password" autocomplete="off" placeholder="کد کارمند را وارد کنید"></div><button class="btn gold" id="loginBtn">ورود</button><p id="msg" class="status">آماده ورود.</p></section><main id="app" class="hide"><section class="panel row"><button class="btn gold" onclick="loadFoods()">↻ تازه‌سازی</button><button class="btn" onclick="logout()">خروج</button></section><section class="panel"><h2>🍽️ غذاها</h2><p class="muted">کارمند فقط می‌تواند قیمت، عکس، غذای روز و وضعیت موجودی را تغییر دهد.</p><div id="foodList"></div><p id="foodMsg" class="status"></p></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://bjpascssizuskiujnzvf.supabase.co',K='sb_publishable_VMPe2QDMNfdwwAEAYQ2Y4A_3idOGTvr',B='food-images',$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;');let sb=supabase.createClient(U,K);function m(id,t,c){$(id).textContent=t;$(id).style.color=c||''}async function login(){m('msg','در حال ورود...');let a=await sb.auth.signInAnonymously();if(a.error)return m('msg','❌ ورود موقت فعال نیست یا خطا رخ داد: '+a.error.message,'#b52b2b');let r=await sb.functions.invoke('guest-employee-login',{body:{code:$('code').value}});if(r.error)return m('msg','❌ '+r.error.message,'#b52b2b');if(!r.data?.ok)return m('msg','❌ '+(r.data?.message||'ورود انجام نشد'),'#b52b2b');$('login').classList.add('hide');$('app').classList.remove('hide');await loadFoods();m('msg','✅ ورود کارمند موفق شد.','#197a4b')}$('loginBtn').onclick=login;$('code').onkeydown=e=>{if(e.key==='Enter')login()};async function logout(){await sb.auth.signOut();location.reload()}async function upload(file){if(!file)return null;let path='employee/'+crypto.randomUUID()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');let r=await sb.storage.from(B).upload(path,file,{upsert:false});if(r.error)throw r.error;return sb.storage.from(B).getPublicUrl(path).data.publicUrl}async function loadFoods(){let r=await sb.from('foods').select('id,name,price,image_url,stock_status,daily,price_options').order('sort_order');if(r.error)return m('foodMsg','❌ '+r.error.message,'#b52b2b');let foods=r.data||[];let pids=foods.map(x=>x.id);let pr=await sb.from('pizza_sizes').select('food_id,one_price,two_price,family_price').in('food_id',pids.length?pids:[-1]);let pm=new Map((pr.data||[]).map(x=>[x.food_id,x]));$('foodList').innerHTML=foods.map(f=>{let p=pm.get(f.id);return `<div class="food"><div>${f.image_url?`<img src="${esc(f.image_url)}">`:'<div class="muted">بدون عکس</div>'}</div><div><h3>${esc(f.name)}</h3><div class="grid"><div class="field"><label>قیمت</label><input id="price_${f.id}" type="number" value="${f.price??0}"></div><div class="field"><label>وضعیت</label><select id="stock_${f.id}"><option value="available" ${f.stock_status==='available'?'selected':''}>🟢 موجود</option><option value="soldout" ${f.stock_status==='soldout'?'selected':''}>🔴 تمام شده</option></select></div></div><p><label><input id="daily_${f.id}" type="checkbox" ${f.daily?'checked':''}> غذای روز</label></p><div class="field"><label>📷 عکس جدید</label><input id="img_${f.id}" type="file" accept="image/*"></div>${p?`<div class="pizza"><b>🍕 قیمت پیتزا</b><div class="grid"><div class="field"><label>یک‌نفره</label><input id="one_${f.id}" type="number" value="${p.one_price??''}"></div><div class="field"><label>دو‌نفره</label><input id="two_${f.id}" type="number" value="${p.two_price??''}"></div><div class="field"><label>خانواده</label><input id="family_${f.id}" type="number" value="${p.family_price??''}"></div></div></div>`:''}<p><button class="btn gold" onclick="saveFood(${f.id},${p?'true':'false'})">💾 ذخیره</button></p></div></div>`}).join('')||'<p class="muted">غذایی وجود ندارد.</p>'}async function saveFood(id,hasPizza){try{let image=await upload($('img_'+id).files[0]);let patch={price:Number($('price_'+id).value||0),daily:$('daily_'+id).checked,stock_status:$('stock_'+id).value};if(image)patch.image_url=image;let r=await sb.from('foods').update(patch).eq('id',id);if(r.error)throw r.error;if(hasPizza){let p={one_price:$('one_'+id).value===''?null:Number($('one_'+id).value),two_price:$('two_'+id).value===''?null:Number($('two_'+id).value),family_price:$('family_'+id).value===''?null:Number($('family_'+id).value)};let q=await sb.from('pizza_sizes').update(p).eq('food_id',id);if(q.error)throw q.error}m('foodMsg','✅ ذخیره شد.','#197a4b');await loadFoods()}catch(e){m('foodMsg','❌ '+e.message,'#b52b2b')}}sb.auth.getSession().then(async({data})=>{if(data.session){let r=await sb.from('staff_access').select('role,enabled').eq('user_id',data.session.user.id).eq('role','employee').eq('enabled',true).maybeSingle();if(r.data){$('login').classList.add('hide');$('app').classList.remove('hide');loadFoods()}}});</script></body></html>
