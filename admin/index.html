<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت منوی حاجی حیدری</title><style>body{font-family:Tahoma,Arial;background:#f4f6f8;margin:0;color:#18243a}.wrap{max-width:1050px;margin:auto;padding:20px}.box{background:white;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 5px 20px #0001}.head{background:#07172f;color:white;border-radius:18px;padding:20px;display:flex;justify-content:space-between;align-items:center}.btn{border:0;border-radius:10px;padding:10px 15px;background:#07172f;color:white;cursor:pointer}.gold{background:#d8b45a;color:#07172f}.danger{background:#b52b2b}.ok{background:#1f7a4d}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field input,.field select{padding:10px;border:1px solid #ddd;border-radius:9px;font:inherit}.item{border:1px solid #ddd;border-radius:12px;padding:12px;margin:8px 0}.hide{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.head{flex-direction:column;gap:10px}}</style></head><body><div class="wrap"><div class="head"><div><h1>⚙️ مدیریت منوی حاجی حیدری</h1><small>غذاها، سفارش‌ها و نظرات</small></div><button class="btn gold" onclick="out()">خروج</button></div><div id="login" class="box"><h2>ورود مدیر</h2><div class="grid"><div class="field">ایمیل<input id="email" type="email"></div><div class="field">رمز عبور<input id="pass" type="password"></div></div><button class="btn" style="margin-top:12px" onclick="login()">ورود</button><p id="msg"></p></div><div id="app" class="hide"><div class="box"><button class="btn" onclick="show('foods')">🍽️ غذاها</button> <button class="btn" onclick="show('cats')">📂 دسته‌ها</button> <button class="btn" onclick="show('orders')">🛒 سفارش‌ها</button> <button class="btn" onclick="show('reviews')">⭐ نظرات</button></div><section id="foods" class="box"><h2>غذاها</h2><div class="grid"><div class="field">نام غذا<input id="fn"></div><div class="field">قیمت<input id="fp" type="number"></div><div class="field">دسته<select id="fc"></select></div><div class="field">آدرس عکس<input id="fi"></div></div><p><label><input id="fd" type="checkbox"> غذای روز</label> <select id="fs"><option value="available">موجود</option><option value="soldout">تمام شد</option></select></p><button class="btn gold" onclick="addFood()">+ افزودن غذا</button><div id="fl"></div></section><section id="cats" class="box hide"><h2>دسته‌ها</h2><input id="cn" placeholder="نام دسته"> <button class="btn gold" onclick="addCat()">+ افزودن</button><div id="cl"></div></section><section id="orders" class="box hide"><h2>سفارش‌ها</h2><div id="ol"></div></section><section id="reviews" class="box hide"><h2>نظرات</h2><div id="rl"></div></section></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://bjpascssizuskjuinzvf.supabase.co','sb_publishable_VMPe2QDMNfdwwAEAYQ2Y4A_3idOGTvr'),$=x=>document.getElementById(x);async function login(){const r=await sb.auth.signInWithPassword({email:$('email').value,password:$('pass').value});$('msg').textContent=r.error?r.error.message:'ورود موفق شد';if(!r.error)boot()}async function out(){await sb.auth.signOut();location.reload()}function show(x){['foods','cats','orders','reviews'].forEach(y=>$(y).classList.toggle('hide',x!==y))}async function boot(){$('login').classList.add('hide');$('app').classList.remove('hide');await cats();await foods();await orders();await reviews()}async function cats(){const r=await sb.from('categories').select('*').order('sort_order');if(r.error)return;fc.innerHTML=r.data.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');cl.innerHTML=r.data.map(x=>`<div class=item><b>${x.name}</b> <button class="btn danger" onclick="delCat(${x.id})">حذف</button></div>`).join('')}async function addCat(){const n=cn.value.trim();if(!n)return;const r=await sb.from('categories').insert({name:n});if(r.error)alert(r.error.message);else{cn.value='';cats()}}async function delCat(id){if(confirm('حذف شود؟')){await sb.from('categories').delete().eq('id',id);cats()}}async function foods(){const r=await sb.from('foods').select('*,categories(name)').order('id',{ascending:false});if(r.error)return;fl.innerHTML=r.data.map(x=>`<div class=item><b>${x.name}</b> — ${Number(x.price).toLocaleString('fa-AF')} افغانی (${x.categories?.name||'بدون دسته'})<br><button class="btn ${x.stock_status==='available'?'ok':'danger'}" onclick="stock(${x.id},'${x.stock_status}')">${x.stock_status==='available'?'موجود':'تمام شد'}</button> <button class="btn" onclick="daily(${x.id},${x.daily})">${x.daily?'غذای روز ✓':'غذای روز'}</button></div>`).join('')}async function addFood(){const v={name:fn.value.trim(),price:Number(fp.value||0),category_id:Number(fc.value),image_url:fi.value.trim()||null,daily:fd.checked,stock_status:fs.value};if(!v.name)return;const r=await sb.from('foods').insert(v);if(r.error)alert(r.error.message);else{fn.value=fp.value=fi.value='';fd.checked=false;foods()}}async function stock(id,s){await sb.from('foods').update({stock_status:s==='available'?'soldout':'available',updated_at:new Date().toISOString()}).eq('id',id);foods()}async function daily(id,v){await sb.from('foods').update({daily:!v,updated_at:new Date().toISOString()}).eq('id',id);foods()}async function orders(){const r=await sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false});ol.innerHTML=r.error?'<p>دسترسی سفارش‌ها تنظیم نشده است.</p>':(r.data.length?r.data.map(x=>`<div class=item><b>${x.order_no}</b> — ${x.customer_name||''}<br>جمع: ${Number(x.total).toLocaleString('fa-AF')} افغانی<br><select onchange="setOrder(${x.id},this.value)">${['new','accepted','preparing','ready','completed','cancelled'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div>`).join(''):'<p>سفارشی نیست.</p>')}async function setOrder(id,status){await sb.from('orders').update({status}).eq('id',id);orders()}async function reviews(){const r=await sb.from('reviews').select('*').order('created_at',{ascending:false});rl.innerHTML=r.error?'<p>'+r.error.message+'</p>':(r.data.length?r.data.map(x=>`<div class=item><b>${x.customer_name||'مهمان'}</b> — غذا ${x.food_rating}/5 · نوشیدنی ${x.drink_rating}/5 · محیط ${x.environment_rating}/5 · مهمان‌نوازی ${x.hospitality_rating}/5<br>${x.comment||''}<br><button class="btn ${x.approved?'danger':'ok'}" onclick="approve(${x.id},${x.approved})">${x.approved?'لغو تأیید':'تأیید'}</button></div>`).join(''):'<p>نظری نیست.</p>')}async function approve(id,v){await sb.from('reviews').update({approved:!v}).eq('id',id);reviews()}sb.auth.getSession().then(x=>{if(x.data.session)boot()})</script></body></html>
